<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" role="img" aria-labelledby="title desc">
<title id="title">面向 agent 的自动化验证能力架构</title>
<desc id="desc">外部 agent 调用 setup 和基础验证 MCP，使用 Playwright 或获准的外部 Computer Use 操作专用 Mac 上的被测 Electron 与 daemon，诊断和截图关联后归档。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
