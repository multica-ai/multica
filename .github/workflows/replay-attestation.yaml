name: Replay Attestation

on:
  repository_dispatch:
    types: [replay-attestation]
  workflow_dispatch:
    inputs:
      pr-numbers:
        required: false
        type: string
        description: "Comma-separated merged PR numbers to replay (manual retry/backfill). Leave empty to run backfill discovery instead."
      repo:
        required: false
        type: string
        description: "owner/repo to target for backfill discovery or cross-verify (defaults to this repo)"
      limit:
        required: false
        type: string
        description: "backfill only: max PRs to dispatch in one run (defaults to 100, capped at 500 by the endpoint)"
      run-cross-verify:
        required: false
        type: boolean
        default: false
        description: "manual dispatch only: run cross-verification instead of replay/backfill"
  schedule:
    - cron: '43 */6 * * *'
    - cron: '17 */6 * * *'

jobs:
  orchestrate:
    uses: g2crowd/gh-actions/.github/workflows/replay-attestation.yml@main
    with:
      pr-numbers: ${{ inputs['pr-numbers'] || '' }}
      repo: ${{ inputs.repo || '' }}
      limit: ${{ inputs.limit || '' }}
      run-cross-verify: ${{ inputs['run-cross-verify'] || false }}
    secrets: inherit
