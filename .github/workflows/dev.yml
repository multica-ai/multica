name: Dev cluster Deployment

on:
  pull_request:
    types:
      - labeled
      - synchronize
      - opened
    paths-ignore:
      - "gitops/**"

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  attestations: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Dev/prod image discrimination is done at the image-repo level, not via tag
  # prefix: dev.yml passes `environment: dev` (line 56+) to the reusable bake
  # workflow, which forwards it as the `ENVIRONMENT` env var into
  # docker/bake-action. The three app bakefiles (docker-bake.{backend,web,
  # agentrunner}.hcl) then compose the final image as
  # `${APP_IMAGE_BASE}-${ENVIRONMENT}:${IMG_SHA}` so this workflow pushes to
  # ghcr.io/g2crowd/agentfarm-{backend,web,agentrunner}-dev:<sha> while
  # publish.yml continues pushing to the -prod repos. ArgoCD Image Updater on
  # the agentfarm-development Application points at the -dev repos and picks
  # newest SHA. No tag-format coordination across workflows is needed.

jobs:
  # The shared agent-runtime base must build before any image that FROMs it.
  # Same merge-ordering rule as publish.yml — agentrunner and devenv-runtime
  # default to BASE_TAG=latest, so the base needs to publish first.
  #
  # Split into per-arch matrix legs because the base image's hermes install
  # crashes uv with SIGSEGV under QEMU x86_64 emulation on arm64 runners.
  # Each leg runs on its native arch, pushes an arch-suffixed tag
  # (:<sha>-amd64 / :<sha>-arm64), and the merge job below stitches them
  # into the canonical :<sha> + :latest multi-arch manifest that downstream
  # FROM ghcr.io/g2crowd/agent-runtime-base:latest builds consume.
  bake-build-agent-runtime-base-arch:
    if: contains(github.event.pull_request.labels.*.name, 'Development')
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: default-amd64
            runs-on: ubicloud-standard-4
          - target: default-arm64
            runs-on: ubicloud-standard-4-arm
    uses: g2crowd/gh-actions/.github/workflows/gitops-bake-build.yml@main
    with:
      environment: dev
      branch: ${{ github.head_ref || github.ref_name }}
      bakefile: docker/agent-runtime-base/docker-bake.hcl
      targets: ${{ matrix.target }}
      runs-on: ${{ matrix.runs-on }}
    secrets: inherit

  bake-build-agent-runtime-base:
    if: contains(github.event.pull_request.labels.*.name, 'Development')
    needs: [bake-build-agent-runtime-base-arch]
    runs-on: ubicloud-standard-4-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Mirror the reusable bake workflow's checkout so `git rev-parse
          # HEAD` produces the same SHA the per-arch tags were built with.
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set short git commit SHA
        id: sha
        run: |
          REAL_COMMIT_SHA="$(git rev-parse HEAD)"
          echo "short_sha=${REAL_COMMIT_SHA:0:8}" >> "$GITHUB_OUTPUT"
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Create multi-arch manifest from per-arch tags
        env:
          SHORT_SHA: ${{ steps.sha.outputs.short_sha }}
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/g2crowd/agent-runtime-base:${SHORT_SHA}" \
            --tag "ghcr.io/g2crowd/agent-runtime-base:latest" \
            "ghcr.io/g2crowd/agent-runtime-base:${SHORT_SHA}-amd64" \
            "ghcr.io/g2crowd/agent-runtime-base:${SHORT_SHA}-arm64"
      - name: Inspect resulting manifest
        env:
          SHORT_SHA: ${{ steps.sha.outputs.short_sha }}
        run: |
          docker buildx imagetools inspect \
            "ghcr.io/g2crowd/agent-runtime-base:${SHORT_SHA}"

  bake-build-backend:
    if: contains(github.event.pull_request.labels.*.name, 'Development')
    uses: g2crowd/gh-actions/.github/workflows/gitops-bake-build.yml@main
    with:
      environment: dev
      branch: ${{ github.head_ref || github.ref_name }}
      bakefile: docker-bake.backend.hcl
      runs-on: ubicloud-standard-4-arm
    secrets: inherit

  bake-build-web:
    if: contains(github.event.pull_request.labels.*.name, 'Development')
    uses: g2crowd/gh-actions/.github/workflows/gitops-bake-build.yml@main
    with:
      environment: dev
      branch: ${{ github.head_ref || github.ref_name }}
      bakefile: docker-bake.web.hcl
      runs-on: ubicloud-standard-4-arm
    secrets: inherit

  bake-build-agentrunner:
    if: contains(github.event.pull_request.labels.*.name, 'Development')
    # FROMs agent-runtime-base — base must build first.
    needs: [bake-build-agent-runtime-base]
    uses: g2crowd/gh-actions/.github/workflows/gitops-bake-build.yml@main
    with:
      environment: dev
      branch: ${{ github.head_ref || github.ref_name }}
      bakefile: docker-bake.agentrunner.hcl
      runs-on: ubicloud-standard-4-arm
    secrets: inherit

  bake-build-devenv-runtime:
    if: contains(github.event.pull_request.labels.*.name, 'Development')
    # FROMs agent-runtime-base — base must build first.
    needs: [bake-build-agent-runtime-base]
    uses: g2crowd/gh-actions/.github/workflows/gitops-bake-build.yml@main
    with:
      environment: dev
      branch: ${{ github.head_ref || github.ref_name }}
      bakefile: docker/devenv-runtime/docker-bake.hcl
      runs-on: ubicloud-standard-4-arm
    secrets: inherit
