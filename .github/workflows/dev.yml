name: Dev cluster Deployment

on:
  pull_request:
    types:
      - labeled
      - synchronize
      - opened
    paths-ignore:
      - "gitops/**"

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  attestations: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # DEV_TAG is picked up by docker-bake.*.hcl as an HCL variable override.
  # It causes each bakefile to emit a second "dev-<sha>" tag alongside the
  # plain SHA tag so that ArgoCD Image Updater can filter dev builds by the
  # "^dev-" prefix without accidentally picking up prod/main images.
  # github.event.pull_request.head.sha is the actual PR head commit SHA
  # (the same 40-char SHA the bake workflow truncates to 8 chars for IMG_SHA).
  DEV_TAG: dev-${{ github.event.pull_request.head.sha }}

jobs:
  bake-build-backend:
    if: contains(github.event.pull_request.labels.*.name, 'Development')
    uses: g2crowd/gh-actions/.github/workflows/gitops-bake-build.yml@main
    with:
      environment: dev
      branch: ${{ github.head_ref || github.ref_name }}
      bakefile: docker-bake.backend.hcl
      runs-on: ubicloud-standard-4-arm
    secrets: inherit

  bake-build-web:
    if: contains(github.event.pull_request.labels.*.name, 'Development')
    uses: g2crowd/gh-actions/.github/workflows/gitops-bake-build.yml@main
    with:
      environment: dev
      branch: ${{ github.head_ref || github.ref_name }}
      bakefile: docker-bake.web.hcl
      runs-on: ubicloud-standard-4-arm
    secrets: inherit
