name: Dev cluster Deployment

on:
  pull_request:
    types:
      - labeled
      - synchronize
      - opened
    paths-ignore:
      - "gitops/**"

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  attestations: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Split into per-arch matrix legs because the base image's hermes install
  # crashes uv with SIGSEGV under QEMU x86_64 emulation on arm64 runners.
  # Each leg runs on its native arch, pushes an arch-suffixed tag
  # (:<sha>-amd64 / :<sha>-arm64), and the merge job below stitches them
  # into the canonical :<sha> + :latest multi-arch manifest that downstream
  # FROM ghcr.io/g2crowd/agent-runtime-base:latest builds consume.
  bake-build-agent-runtime-base-arch:
    if: contains(github.event.pull_request.labels.*.name, 'Development')
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: default-amd64
            runs-on: ubicloud-standard-4
          - target: default-arm64
            runs-on: ubicloud-standard-4-arm
    uses: g2crowd/gh-actions/.github/workflows/gitops-bake-build.yml@main
    with:
      environment: dev
      # Pin to the PR branch tip SHA (same value the merge job uses) so
      # arch-suffixed tags and the manifest stitch reference the same commit.
      branch: ${{ github.event.pull_request.head.sha || github.sha }}
      bakefile: docker/agent-runtime-base/docker-bake.hcl
      targets: ${{ matrix.target }}
      runs-on: ${{ matrix.runs-on }}
    secrets: inherit

  bake-build-agent-runtime-base:
    if: contains(github.event.pull_request.labels.*.name, 'Development')
    needs: [bake-build-agent-runtime-base-arch]
    runs-on: ubicloud-standard-4-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set short git commit SHA
        id: sha
        env:
          # Use the PR branch HEAD SHA so it matches what the per-arch
          # bake jobs compute (those fetch the branch by name and resolve
          # its HEAD, not the merge-commit SHA that github.sha carries for
          # PR events). github.event.pull_request.head.sha is the branch tip.
          BRANCH_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "short_sha=${BRANCH_SHA:0:8}" >> "$GITHUB_OUTPUT"
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Create multi-arch manifest from per-arch tags
        env:
          SHORT_SHA: ${{ steps.sha.outputs.short_sha }}
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/g2crowd/agent-runtime-base:${SHORT_SHA}" \
            --tag "ghcr.io/g2crowd/agent-runtime-base:latest" \
            "ghcr.io/g2crowd/agent-runtime-base:${SHORT_SHA}-amd64" \
            "ghcr.io/g2crowd/agent-runtime-base:${SHORT_SHA}-arm64"
      - name: Inspect resulting manifest
        env:
          SHORT_SHA: ${{ steps.sha.outputs.short_sha }}
        run: |
          docker buildx imagetools inspect \
            "ghcr.io/g2crowd/agent-runtime-base:${SHORT_SHA}"

  bake-build-backend:
    if: contains(github.event.pull_request.labels.*.name, 'Development')
    uses: g2crowd/gh-actions/.github/workflows/gitops-bake-build.yml@main
    with:
      environment: dev
      branch: ${{ github.head_ref || github.ref_name }}
      bakefile: docker-bake.backend.hcl
      runs-on: ubicloud-standard-4-arm
    secrets: inherit

  bake-build-web:
    if: contains(github.event.pull_request.labels.*.name, 'Development')
    uses: g2crowd/gh-actions/.github/workflows/gitops-bake-build.yml@main
    with:
      environment: dev
      branch: ${{ github.head_ref || github.ref_name }}
      bakefile: docker-bake.web.hcl
      runs-on: ubicloud-standard-4-arm
    secrets: inherit

  # ---- Server group: bump backend then web in environments/development/kustomization.yaml ----
  # backend and web write the same file (indices [0] and [1]); chaining them
  # keeps the two pushes ordered and avoids a non-fast-forward rejection.
  extract-server-tags:
    if: contains(github.event.pull_request.labels.*.name, 'Development')
    needs: [bake-build-backend, bake-build-web]
    runs-on: ${{ vars.GH_RUNNER || 'ubicloud-standard-2-ubuntu-2404' }}
    outputs:
      backend_tag: ${{ steps.extract.outputs.backend_tag }}
      web_tag: ${{ steps.extract.outputs.web_tag }}
    steps:
      - name: Extract server image tags
        id: extract
        env:
          BACKEND_IMAGE: ${{ needs.bake-build-backend.outputs.image_name }}
          WEB_IMAGE: ${{ needs.bake-build-web.outputs.image_name }}
        run: |
          echo "backend_tag=${BACKEND_IMAGE##*:}" >> "$GITHUB_OUTPUT"
          echo "web_tag=${WEB_IMAGE##*:}" >> "$GITHUB_OUTPUT"

  commit-to-gitops-backend:
    if: contains(github.event.pull_request.labels.*.name, 'Development')
    needs: [extract-server-tags]
    uses: g2crowd/gh-actions/.github/workflows/gitops-deploy.yml@main
    secrets: inherit
    with:
      gitops_repository: g2crowd/agentfarm
      image_tag: ${{ needs.extract-server-tags.outputs.backend_tag }}
      app_repo_branch: ${{ github.head_ref || github.ref_name }}
      path_to_kustomization: gitops/environments/development/kustomization.yaml
      image_yq_matcher: .images[0].newTag

  commit-to-gitops-web:
    if: contains(github.event.pull_request.labels.*.name, 'Development')
    needs: [extract-server-tags, commit-to-gitops-backend]
    uses: g2crowd/gh-actions/.github/workflows/gitops-deploy.yml@main
    secrets: inherit
    with:
      gitops_repository: g2crowd/agentfarm
      image_tag: ${{ needs.extract-server-tags.outputs.web_tag }}
      app_repo_branch: ${{ github.head_ref || github.ref_name }}
      path_to_kustomization: gitops/environments/development/kustomization.yaml
      image_yq_matcher: .images[1].newTag

  # ---- Runner group: bump agentrunner-runtime in agent-runtime-devserver ----
  bake-build-agentrunner-runtime:
    if: contains(github.event.pull_request.labels.*.name, 'Development')
    needs: [bake-build-agent-runtime-base]
    uses: g2crowd/gh-actions/.github/workflows/gitops-bake-build.yml@main
    with:
      environment: dev
      branch: ${{ github.head_ref || github.ref_name }}
      bakefile: docker/agentrunner-runtime/docker-bake.hcl
      runs-on: ubicloud-standard-4-arm
    secrets: inherit

  extract-agentrunner-runtime-tag:
    if: contains(github.event.pull_request.labels.*.name, 'Development')
    needs: [bake-build-agentrunner-runtime]
    runs-on: ${{ vars.GH_RUNNER || 'ubicloud-standard-2-ubuntu-2404' }}
    outputs:
      agentrunner_runtime_tag: ${{ steps.extract.outputs.agentrunner_runtime_tag }}
    steps:
      - name: Extract agentrunner-runtime image tag
        id: extract
        env:
          AGENTRUNNER_RUNTIME_IMAGE: ${{ needs.bake-build-agentrunner-runtime.outputs.image_name }}
        run: |
          echo "agentrunner_runtime_tag=${AGENTRUNNER_RUNTIME_IMAGE##*:}" >> "$GITHUB_OUTPUT"

  # agent-runtime-devserver bumps g2crowd/agentfarm at a DIFFERENT path than the
  # server bump, so the reusable workflow's repo+path concurrency group does NOT
  # serialize it against the server commits. It is chained after
  # commit-to-gitops-web to avoid a concurrent push to the PR head branch, which
  # the shared gitops-deploy workflow does not rebase/retry — the loser of that
  # race is rejected non-fast-forward and fails the whole dev deploy. By the time
  # the agentrunner image (last in the build chain) is ready, the server commits
  # have long finished, so this dependency adds no real latency.
  commit-to-gitops-agent-runtime-devserver:
    if: contains(github.event.pull_request.labels.*.name, 'Development')
    needs: [extract-agentrunner-runtime-tag, commit-to-gitops-web]
    uses: g2crowd/gh-actions/.github/workflows/gitops-deploy.yml@main
    secrets: inherit
    with:
      gitops_repository: g2crowd/agentfarm
      image_tag: ${{ needs.extract-agentrunner-runtime-tag.outputs.agentrunner_runtime_tag }}
      app_repo_branch: ${{ github.head_ref || github.ref_name }}
      path_to_kustomization: gitops/environments/development/agent-runtime-devserver/kustomization.yaml
      image_yq_matcher: .images[0].newTag

