name: Prod cluster Deployment

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'gitops/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  id-token: write
  contents: read
  attestations: write
  packages: write
  actions: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The shared agent-runtime base must publish before devenv-runtime which FROMs it.
  # devenv-runtime defaults to BASE_TAG=latest, so the base bake's :latest tag is
  # what it pulls on a fresh build. To pin a specific base, bump BASE_TAG in
  # docker/devenv-runtime/docker-bake.hcl to the IMG_SHA tag.
  #
  # Split into per-arch matrix legs because the base image's hermes install
  # crashes uv with SIGSEGV under QEMU x86_64 emulation on arm64 runners.
  # Each leg runs on its native arch, pushes an arch-suffixed tag
  # (:<sha>-amd64 / :<sha>-arm64), and the merge job below stitches them
  # into the canonical :<sha> + :latest multi-arch manifest that downstream
  # FROM ghcr.io/g2crowd/agent-runtime-base:latest builds consume.
  bake-build-agent-runtime-base-arch:
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: default-amd64
            runs-on: ubicloud-standard-4
          - target: default-arm64
            runs-on: ubicloud-standard-4-arm
    uses: g2crowd/gh-actions/.github/workflows/gitops-bake-build.yml@main
    with:
      environment: prod
      branch: ${{ github.head_ref || github.ref_name }}
      bakefile: docker/agent-runtime-base/docker-bake.hcl
      targets: ${{ matrix.target }}
      runs-on: ${{ matrix.runs-on }}
    secrets: inherit

  bake-build-agent-runtime-base:
    needs: [bake-build-agent-runtime-base-arch]
    runs-on: ubicloud-standard-4-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set short git commit SHA
        id: sha
        env:
          # Use the workflow-trigger SHA, not `main` HEAD: by the time this
          # merge job runs, sibling commit-to-gitops-* jobs from the same
          # workflow may have already pushed image-tag bumps that advanced
          # main past the per-arch jobs' build SHA. Checking out main and
          # running `git rev-parse HEAD` here would yield a SHA the per-arch
          # tags were never built with, breaking the manifest stitch.
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          echo "short_sha=${WORKFLOW_SHA:0:8}" >> "$GITHUB_OUTPUT"
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Create multi-arch manifest from per-arch tags
        env:
          SHORT_SHA: ${{ steps.sha.outputs.short_sha }}
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/g2crowd/agent-runtime-base:${SHORT_SHA}" \
            --tag "ghcr.io/g2crowd/agent-runtime-base:latest" \
            "ghcr.io/g2crowd/agent-runtime-base:${SHORT_SHA}-amd64" \
            "ghcr.io/g2crowd/agent-runtime-base:${SHORT_SHA}-arm64"
      - name: Inspect resulting manifest
        env:
          SHORT_SHA: ${{ steps.sha.outputs.short_sha }}
        run: |
          docker buildx imagetools inspect \
            "ghcr.io/g2crowd/agent-runtime-base:${SHORT_SHA}"

  bake-build-backend:
    uses: g2crowd/gh-actions/.github/workflows/gitops-bake-build.yml@main
    with:
      environment: prod
      branch: ${{ github.head_ref || github.ref_name }}
      bakefile: docker-bake.backend.hcl
      runs-on: ubicloud-standard-4-arm
    secrets: inherit

  bake-build-web:
    uses: g2crowd/gh-actions/.github/workflows/gitops-bake-build.yml@main
    with:
      environment: prod
      branch: ${{ github.head_ref || github.ref_name }}
      bakefile: docker-bake.web.hcl
      runs-on: ubicloud-standard-4-arm
    secrets: inherit

  bake-build-devenv-runtime:
    # FROMs agent-runtime-base:latest — base must publish first.
    needs: [bake-build-agent-runtime-base]
    uses: g2crowd/gh-actions/.github/workflows/gitops-bake-build.yml@main
    with:
      environment: prod
      branch: ${{ github.head_ref || github.ref_name }}
      bakefile: docker/devenv-runtime/docker-bake.hcl
      runs-on: ubicloud-standard-4-arm
    secrets: inherit

  bake-build-agentrunner-runtime:
    # Post-S1A: FROMs agent-runtime-base directly (no devenv-runtime in the
    # FROM chain). Builds in parallel with bake-build-devenv-runtime — both
    # only wait on the shared base image.
    needs: [bake-build-agent-runtime-base]
    uses: g2crowd/gh-actions/.github/workflows/gitops-bake-build.yml@main
    with:
      environment: prod
      branch: ${{ github.head_ref || github.ref_name }}
      bakefile: docker/agentrunner-runtime/docker-bake.hcl
      runs-on: ubicloud-standard-4-arm
    secrets: inherit

  # ----------------------------------------------------------------------------
  # Tag extraction + GitOps image bumps.
  #
  # The deploy fans out into two independent groups so a fast server build is
  # never held hostage by the slow runner build chain (PLA-391). Previously a
  # single `extract-tags` job depended on all four bake-builds, so the backend
  # (built in ~30s) could not deploy until the base -> devenv -> agentrunner
  # chain finished minutes later.
  #
  #   * Server group  — backend + web build in parallel, then bump their two
  #     image tags in gitops/environments/tools/kustomization.yaml.
  #   * Runner group  — agent-runtime-base -> devenv -> agentrunner build in
  #     sequence (FROM chain); each runner image bumps its gitops target as
  #     soon as that image is built.
  #
  # Serialization rule for the commits below: the reusable gitops-deploy
  # workflow keys its concurrency group on (repository + kustomization path)
  # and pushes with a plain `git push` (no rebase/retry). Two deploys racing on
  # the SAME repo+path are queued safely; two deploys to the same repo at
  # DIFFERENT paths are NOT — the second push is rejected non-fast-forward.
  # Every commit that targets g2crowd/agentfarm is therefore chained into one
  # sequence (backend -> web -> agent-runtime). The devenv-runtime bump targets
  # the separate g2crowd/configuration repo and runs fully in parallel.
  # ----------------------------------------------------------------------------

  extract-server-tags:
    needs: [bake-build-backend, bake-build-web]
    runs-on: ubuntu-latest
    outputs:
      backend_tag: ${{ steps.extract.outputs.backend_tag }}
      web_tag: ${{ steps.extract.outputs.web_tag }}
    steps:
      - name: Extract server image tags
        id: extract
        env:
          BACKEND_IMAGE: ${{ needs.bake-build-backend.outputs.image_name }}
          WEB_IMAGE: ${{ needs.bake-build-web.outputs.image_name }}
        run: |
          echo "backend_tag=${BACKEND_IMAGE##*:}" >> "$GITHUB_OUTPUT"
          echo "web_tag=${WEB_IMAGE##*:}" >> "$GITHUB_OUTPUT"

  extract-devenv-runtime-tag:
    needs: [bake-build-devenv-runtime]
    runs-on: ubuntu-latest
    outputs:
      devenv_runtime_tag: ${{ steps.extract.outputs.devenv_runtime_tag }}
    steps:
      - name: Extract devenv-runtime image tag
        id: extract
        env:
          DEVENV_RUNTIME_IMAGE: ${{ needs.bake-build-devenv-runtime.outputs.image_name }}
        run: |
          echo "devenv_runtime_tag=${DEVENV_RUNTIME_IMAGE##*:}" >> "$GITHUB_OUTPUT"

  extract-agentrunner-runtime-tag:
    needs: [bake-build-agentrunner-runtime]
    runs-on: ubuntu-latest
    outputs:
      agentrunner_runtime_tag: ${{ steps.extract.outputs.agentrunner_runtime_tag }}
    steps:
      - name: Extract agentrunner-runtime image tag
        id: extract
        env:
          AGENTRUNNER_RUNTIME_IMAGE: ${{ needs.bake-build-agentrunner-runtime.outputs.image_name }}
        run: |
          echo "agentrunner_runtime_tag=${AGENTRUNNER_RUNTIME_IMAGE##*:}" >> "$GITHUB_OUTPUT"

  # ---- Server group: bump backend then web in tools/kustomization.yaml ----
  # backend and web write the same file (indices [0] and [1]); chaining them
  # keeps the two pushes ordered and deterministic. Neither waits on the runner
  # build chain anymore.
  commit-to-gitops-backend:
    needs: [extract-server-tags]
    uses: g2crowd/gh-actions/.github/workflows/gitops-deploy.yml@main
    secrets: inherit
    with:
      gitops_repository: g2crowd/agentfarm
      image_tag: ${{ needs.extract-server-tags.outputs.backend_tag }}
      app_repo_branch: ${{ github.head_ref || github.ref_name }}
      path_to_kustomization: gitops/environments/tools/kustomization.yaml
      image_yq_matcher: .images[0].newTag

  commit-to-gitops-web:
    needs: [extract-server-tags, commit-to-gitops-backend]
    uses: g2crowd/gh-actions/.github/workflows/gitops-deploy.yml@main
    secrets: inherit
    with:
      gitops_repository: g2crowd/agentfarm
      image_tag: ${{ needs.extract-server-tags.outputs.web_tag }}
      app_repo_branch: ${{ github.head_ref || github.ref_name }}
      path_to_kustomization: gitops/environments/tools/kustomization.yaml
      image_yq_matcher: .images[1].newTag

  # ---- Runner group ----
  # devenv-runtime bumps the separate g2crowd/configuration repo, so it fires
  # as soon as the devenv image is built and runs in parallel with the server
  # group — no agentfarm push contention.
  commit-to-gitops-devenv-runtime:
    needs: [extract-devenv-runtime-tag]
    uses: g2crowd/gh-actions/.github/workflows/gitops-deploy.yml@main
    secrets: inherit
    with:
      gitops_repository: g2crowd/configuration
      image_tag: ${{ needs.extract-devenv-runtime-tag.outputs.devenv_runtime_tag }}
      app_repo_branch: ${{ github.head_ref || github.ref_name }}
      path_to_kustomization: kustomize/DevOps/devenv/environments/development/kustomization.yaml
      image_yq_matcher: .images[1].newTag

  # agent-runtime bumps g2crowd/agentfarm at a DIFFERENT path than the server
  # bump, so the reusable workflow's repo+path concurrency group does NOT
  # serialize it against the server commits. It is chained after
  # commit-to-gitops-web to avoid a concurrent push to agentfarm main, which
  # the shared gitops-deploy workflow does not rebase/retry. By the time the
  # agentrunner image (last in the build chain) is ready, the server commits
  # have long finished, so this dependency adds no real latency.
  commit-to-gitops-agent-runtime:
    needs: [extract-agentrunner-runtime-tag, commit-to-gitops-web]
    uses: g2crowd/gh-actions/.github/workflows/gitops-deploy.yml@main
    secrets: inherit
    with:
      gitops_repository: g2crowd/agentfarm
      image_tag: ${{ needs.extract-agentrunner-runtime-tag.outputs.agentrunner_runtime_tag }}
      app_repo_branch: ${{ github.head_ref || github.ref_name }}
      path_to_kustomization: gitops/environments/development/agent-runtime/kustomization.yaml
      image_yq_matcher: .images[0].newTag

