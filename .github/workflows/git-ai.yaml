name: Git AI

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: git-ai-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  git-ai:
    if: github.event.pull_request.merged == true
    uses: g2crowd/gh-actions/.github/workflows/ai-attribution.yml@main
    secrets: inherit
