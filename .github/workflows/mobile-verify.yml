name: Mobile Verify

# Runs lint + typecheck for apps/mobile only, parallel to the main CI
# workflow. Path-filtered so PRs that don't touch mobile (or anything
# mobile transitively depends on) pay zero cost.
#
# Path scope rationale — mobile transitively depends on:
# - apps/mobile/**                — the app itself
# - packages/core/**              — mobile imports types AND pure functions
#                                   (agents, markdown, permissions, api/schemas, …),
#                                   not only @multica/core/types
# - package.json / pnpm-lock.yaml — install graph
# - pnpm-workspace.yaml           — catalog versions
# - turbo.json                    — turbo task pipeline
#
# Mobile's vitest suite is intentionally narrow (Node env, pure-function
# tests under apps/mobile/lib/*.test.ts — see apps/mobile/vitest.config.ts).
# RN component-level rendering is not exercised here.
# Repository-wide radius checks run once in CI: frontend-build owns them when
# selected, otherwise frontend-quality handles docs/mobile-only changes.

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/core/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/mobile-verify.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/core/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/mobile-verify.yml"

# Same rule as ci.yml: the push path filter only sees the commits in that
# push, so a cancelled main run would never be re-checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: production
      EXPO_NO_DOTENV: "1"
      EXPO_PUBLIC_API_URL: https://api.multica.ai
      EXPO_PUBLIC_WEB_URL: https://multica.ai
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install mobile dependencies
        run: pnpm install --frozen-lockfile --filter @multica/mobile...
      - name: Install native build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
      - name: Generate Android project
        run: pnpm -C apps/mobile exec expo prebuild -p android --no-install
      - name: Build unsigned Release with embedded bundle
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=4
      - name: Verify standalone bundle and unsigned artifact
        run: |
          apk=apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$apk"
          unzip -Z1 "$apk" | grep -Fx assets/index.android.bundle
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"; then
            echo "CI Release must be unsigned"
            exit 1
          fi

  mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Type check, lint, and test
        run: pnpm exec turbo typecheck lint test --filter=@multica/mobile
