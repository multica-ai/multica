name: Mobile Verify

# Verifies apps/mobile only, parallel to the main CI workflow. Path-filtered
# so PRs that don't touch mobile (or anything mobile transitively depends on)
# pay zero cost.
#
# Path scope rationale — mobile transitively depends on:
# - apps/mobile/**                — the app itself
# - packages/core/**              — mobile runs core whole: API client, auth,
#                                   realtime, React Query and persisted stores
# - package.json / pnpm-lock.yaml — install graph
# - pnpm-workspace.yaml           — catalog versions
# - turbo.json                    — turbo task pipeline
#
# The iOS bundle export catches what tsc cannot: a core change that Metro
# cannot resolve or Hermes cannot compile. Native builds need Xcode and are
# not run here.
# Repository-wide radius checks run once in CI: frontend-build owns them when
# selected, otherwise frontend-quality handles docs/mobile-only changes.

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/core/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/mobile-verify.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/core/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/mobile-verify.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Type check, lint, and test
        run: pnpm exec turbo typecheck lint test --filter=@multica/mobile

      - name: Bundle for iOS
        run: pnpm --filter @multica/mobile bundle:ios
