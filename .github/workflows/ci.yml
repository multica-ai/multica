name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      # Provision pnpm through corepack, which strictly honours the version in
      # package.json#packageManager (pnpm@10.28.2). The previous pnpm/action-setup
      # step "switched" the runner's pre-installed pnpm v11 down to v10, leaving a
      # mixed v11/v10 layout whose peer resolution rejected the v10-authored
      # lockfile (ERR_PNPM_LOCKFILE_MISSING_DEPENDENCY on @tanstack/react-query).
      # corepack gives a clean install of exactly the declared version, so CI runs
      # the same pnpm the lockfile was built with.
      - name: Enable corepack (pnpm@10.28.2 from packageManager)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test self-host env derivation
        run: bash scripts/selfhost-config.test.sh

      - name: Verify reserved-slugs.ts is up to date
        # Re-runs the generator and fails on any drift from the
        # checked-in TypeScript output. The Go side embeds the JSON
        # source directly, so a passing diff here proves both sides
        # share one source of truth.
        run: |
          pnpm generate:reserved-slugs
          git diff --exit-code -- packages/core/paths/reserved-slugs.ts

      - name: Build, type check, and test
        # CEREBRO-PATCH(ci-no-lint-no-mobile): cerebro fork drops lint enforcement
        # (codebase has ~73 i18next/no-literal-string violations on main) and the
        # upstream mobile-verify workflow; @multica/mobile types intentionally
        # drift from cerebro-augmented core types until the mobile schemas are
        # aligned (follow-up issue). @multica/docs is no longer present in the fork.
        run: pnpm exec turbo build typecheck test --concurrency=1 --continue=dependencies-successful --filter='!@multica/mobile'

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: multica
          POSTGRES_USER: multica
          POSTGRES_PASSWORD: multica
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U multica -d multica"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://multica:multica@localhost:5432/multica?sslmode=disable
      # CEREBRO-PATCH(ci-jwt-secret): 64 bytes — satisfies the >= 32-byte requirement enforced by auth.JWTSecret().
      JWT_SECRET: ci-jwt-secret-padding-padding-padding-padding-padding-padding-pad
      # Wires up the RedisLocalSkill*_test.go suite. Distinct from REDIS_URL
      # (which would flip the server binary itself onto the Redis-backed
      # realtime relay + request stores); the tests talk to this Redis
      # directly so they run alongside the Postgres-backed suite.
      REDIS_TEST_URL: redis://localhost:6379/1
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.1"
          cache-dependency-path: server/go.sum

      - name: Build
        run: cd server && go build ./...

      - name: Run migrations
        run: cd server && go run ./cmd/migrate up
        env:
          GONOSUMDB: github.com/hvejsel/firtal-persona

      - name: Test
        run: cd server && go test ./...
        env:
          GONOSUMDB: github.com/hvejsel/firtal-persona

  installer:
    # Stub-driven shell tests for scripts/install.sh. Kept off the heavy
    # backend job so installer regressions surface independently, and
    # exercised on macOS too because the installer targets macOS/Homebrew
    # and `tar` / `sed` / `mktemp` differ between BSD and GNU userlands.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test shell installers
        run: bash scripts/install.test.sh

  cerebro-inference:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cerebro-inference
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cerebro-inference/pyproject.toml

      # Skip the GPU extras (torch/transformers, multi-GB) — mock-mode tests
      # only need the base FastAPI deps. The real model loaders are exercised
      # by deploy verification, not CI.
      - name: Install deps
        run: pip install -e '.[dev]'

      - name: Lint
        run: ruff check app tests scripts

      - name: Test
        run: pytest -q

  upstream-zone-guard:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      BASE_REF: origin/main
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Validate CEREBRO-PATCH markers
        run: bash scripts/validate-cerebro-patches.sh
