name: Infrastructure

# The agent runtime stack (infrastructure/). Validation runs on every change to
# it; deploying is a manual dispatch, because the thing it replaces is the
# machine the team's agents are currently running on.
#
# ci.yml does not cover this path: its frontend jobs typecheck the workspace,
# but `cdk synth` and the template assertions belong with the stack rather than
# in a job every frontend change pays for.
on:
  pull_request:
    branches: [main]
    paths:
      - "infrastructure/**"
      - ".github/workflows/infrastructure.yml"
  push:
    branches: [main]
    paths:
      - "infrastructure/**"
      - ".github/workflows/infrastructure.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "diff shows what would change; deploy applies it"
        type: choice
        default: diff
        options: [diff, deploy]
      stack:
        description: "Which stack to act on"
        type: choice
        default: Multica-AgentRuntime
        options: [Multica-AgentRuntime, Multica-SelfHost]
      allowed_emails:
        description: "Multica-SelfHost only: comma-separated addresses allowed to sign up"
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The script is embedded verbatim in the instance's user data, so a syntax
      # error here is a machine that half-configures itself and never reports a
      # failure anywhere a deploy can see.
      - name: Check shell scripts
        working-directory: infrastructure
        run: |
          for script in assets/bootstrap.sh scripts/*.sh; do
            bash -n "$script"
          done

      - name: Typecheck
        run: pnpm --filter @multica/infrastructure typecheck

      - name: Test
        run: pnpm --filter @multica/infrastructure test

      # No AWS credentials: the app leaves account and region unset when they
      # are absent, so the templates synthesize region-agnostic. The self-host
      # stack is behind a context flag and needs its signup allowlist, so it
      # gets its own invocation rather than going unsynthesized.
      - name: Synth
        run: pnpm --filter @multica/infrastructure synth

      - name: Synth the self-host stack
        working-directory: infrastructure
        run: pnpm exec cdk synth Multica-SelfHost -c selfHost=true -c allowedEmails=ci@example.com --quiet

  # Needs, in repository settings:
  #   secret AWS_DEPLOY_ROLE_ARN  an OIDC role allowed to assume cdk-hnb659fds-*
  #   variable AWS_REGION         the target region
  #   variable MULTICA_DAEMON_ID  the deployed runtime's daemon id, which names
  #                               its runtime rows and so is not committed
  #   environment aws-agent-runtime
  #
  # Put required reviewers on that environment. An agent-runtime deploy replaces
  # the instance whenever the bootstrap script changed, which kills any run in
  # flight on it; a self-host deploy restarts the server.
  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: aws-agent-runtime
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assume the deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: multica-infrastructure-${{ github.run_id }}

      # Each stack needs a value that is deliberately not committed: the agent
      # runtime's daemon id names this installation's runtime rows, and the
      # self-host signup allowlist is what keeps an internet-facing server from
      # letting strangers create accounts. Both live outside the repository and
      # arrive here instead.
      - name: Resolve stack context
        id: context
        env:
          STACK: ${{ inputs.stack }}
          ALLOWED_EMAILS: ${{ inputs.allowed_emails }}
          DAEMON_ID: ${{ vars.MULTICA_DAEMON_ID }}
        run: |
          if [ "$STACK" = "Multica-SelfHost" ]; then
            if [ -z "$ALLOWED_EMAILS" ]; then
              echo "::error::allowed_emails is required for Multica-SelfHost: port 443 is open to the internet, so without an allowlist anyone who finds the URL can sign up."
              exit 1
            fi
            echo "args=-c selfHost=true -c allowedEmails=$ALLOWED_EMAILS" >> "$GITHUB_OUTPUT"
          else
            if [ -z "$DAEMON_ID" ]; then
              echo "::error::Repository variable MULTICA_DAEMON_ID is unset. Deploying the agent runtime without it mints a new daemon id, and the existing runtimes lose their agent bindings and public visibility."
              exit 1
            fi
            echo "args=-c daemonId=$DAEMON_ID" >> "$GITHUB_OUTPUT"
          fi

      # Only for a diff run: `cdk deploy` prints the same change set itself.
      - name: Diff
        if: inputs.action == 'diff'
        working-directory: infrastructure
        run: pnpm exec cdk diff ${{ inputs.stack }} ${{ steps.context.outputs.args }}

      # --require-approval broadening, not never: a change that widens a
      # security group or an IAM policy fails the job instead of applying
      # itself, and then goes through ./scripts/deploy.sh with someone reading
      # the diff.
      - name: Deploy
        if: inputs.action == 'deploy'
        working-directory: infrastructure
        run: pnpm exec cdk deploy ${{ inputs.stack }} ${{ steps.context.outputs.args }} --require-approval broadening --progress events
