name: Harmony Verify

# Runs typecheck + tests for apps/mobile-harmony only, parallel to the main
# CI workflow. Path-filtered so PRs that don't touch the HarmonyOS client (or
# anything it transitively depends on) pay zero cost.
#
# Path scope rationale — mirrors mobile-verify.yml:
# - apps/mobile-harmony/**        — the app itself
# - packages/core/**              — the app imports types AND pure functions
#                                   (api/schemas, …), not only core/types
# - package.json / pnpm-lock.yaml — install graph
# - pnpm-workspace.yaml           — catalog versions
# - turbo.json                    — turbo task pipeline
#
# Node-only scope: vitest runs pure-function tests and the bash tests for
# scripts/harmony-run.sh. No HAP is built here — building one needs DevEco
# Studio tooling that CI does not provide; native rendering is verified on
# the simulator locally (see apps/mobile-harmony/AGENTS.md).

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile-harmony/**"
      - "packages/core/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/harmony-verify.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile-harmony/**"
      - "packages/core/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/harmony-verify.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  harmony:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Type check and test
        run: pnpm exec turbo typecheck test --filter=@multica/mobile-harmony
