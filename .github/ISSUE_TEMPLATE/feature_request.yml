name: "Feature Request"
description: Suggest a new feature or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What are you trying to do, what gets in the way, and who is affected?
      placeholder: |
        When I try to ..., I have to ... / cannot ..., which means ...
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome would solve this problem?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposal (optional)
      description: If you have an idea, explain the high-level design and why it would help. Keep it understandable without much project background, with minimal implementation detail.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives (optional)
      description: Other approaches or workarounds you considered, and why they do not meet the goal.

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots (optional)
      description: Screenshots, mockups, or sketches that help explain the problem or idea.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: >-
        Which part of Multica is this about? Areas marked community-maintained are
        looked after by volunteer maintainers — see
        https://multica.ai/docs/community-maintained. Please do not @-mention a
        maintainer directly; we route reports from here.
      options:
        - Web app
        - Desktop app
        - Mobile app (iOS)
        - CLI
        - Agents and runtimes
        - Issues, projects and workspaces
        - Chat integration — Feishu / Lark or Slack
        - Chat integration — DingTalk (community-maintained)
        - Chat integration — WeCom (community-maintained)
        - Chat integration — Telegram (community-maintained)
        - Chat integration — ShareCRM (community-maintained)
        - Self-hosting and deployment
        - Other / not sure
    validations:
      required: true
