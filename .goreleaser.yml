version: 2

project_name: multica

builds:
  - id: multica
    main: ./cmd/multica
    dir: server
    binary: multica
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  # Legacy archive name kept so already-released CLIs (whose `multica update`
  # looks for `multica_{os}_{arch}.{ext}`) can keep self-updating. Remove
  # once those versions are no longer in use.
  - id: legacy
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
  # Versioned archive name used by current CLI / install scripts /
  # desktop bootstrap going forward.
  - id: versioned
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}-cli-{{ .Version }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

# The Friday release workflow creates the GitHub release with rich,
# Multica-aware notes before this tag-triggered run starts. `mode: append`
# keeps that body intact and just adds the build artifacts.
release:
  mode: append

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - name: multica
    ids:
      - versioned
    # This block is EFFECTIVELY UPSTREAM-ONLY now. On the Firtal fork the
    # release job always passes --skip=homebrew (see
    # .github/workflows/release.yml), because firtal-group/homebrew-tap
    # publishes its own formula AND mirrors the CLI assets from its scheduled
    # workflow (mirror-cli-from-cerebro.yml, every 20 min) using its own
    # credential. Publishing from here as well duplicated that work and failed
    # the whole release on a 403 whenever HOMEBREW_TAP_GITHUB_TOKEN lacked
    # contents:write (FIR-2286, FIR-2107). Kept for upstream multica-ai.
    repository:
      owner: firtal-group
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/firtal-group/firtal-cerebro"
    description: "Multica CLI — local agent runtime and management tool for the Multica platform"
    license: "Apache-2.0"
    install: |
      bin.install "multica"
    test: |
      system "#{bin}/multica", "version"
