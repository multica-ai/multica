name: Cloudflare Pages check

on:
  pull_request:
    paths:
      - "apps/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "wrangler.toml"
      - "Makefile"
  push:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: make check
      - run: pnpm build
      - name: Verify Pages output
        run: test -d apps/web/dist && test -f apps/web/dist/index.html
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Visual replica gate
        run: make visual-check
      - name: Upload visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
