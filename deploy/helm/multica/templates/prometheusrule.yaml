{{- if .Values.monitoring.prometheusRule.enabled }}
{{- $samplerQueryNames := "task_queued|task_running|task_stuck|workspace_total" -}}
{{- $samplerErrorNames := printf "acquire|%s" $samplerQueryNames -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "multica.backend.fullname" . }}-sampler
  labels:
    {{- include "multica.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
    {{- with .Values.monitoring.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: multica-business-sampler
      rules:
        - alert: MulticaBusinessSamplerQueryErrors
          expr: |
            sum by (name) (
              rate(multica_business_sampler_query_errors_total{name=~"{{ $samplerErrorNames }}"}[10m])
            ) > 0
          for: {{ .Values.monitoring.prometheusRule.samplerQueryErrorsFor | quote }}
          labels:
            severity: {{ .Values.monitoring.prometheusRule.severity | quote }}
          annotations:
            summary: "Business sampler query errors"
            description: "Business sampler query {{ "{{ $labels.name }}" }} is returning errors. Metrics may go stale if the query keeps timing out."
        - alert: MulticaBusinessSamplerQueryLatencyHigh
          expr: |
            histogram_quantile(
              0.95,
              sum by (le, name) (
                rate(multica_business_sampler_query_seconds_bucket{name=~"{{ $samplerQueryNames }}"}[10m])
              )
            ) > 0.3
          for: {{ .Values.monitoring.prometheusRule.samplerQueryLatencyFor | quote }}
          labels:
            severity: {{ .Values.monitoring.prometheusRule.severity | quote }}
          annotations:
            summary: "Business sampler query p95 is high"
            description: "Business sampler query {{ "{{ $labels.name }}" }} p95 is above 300ms, leaving little headroom before the 500ms statement_timeout."
        - alert: MulticaSeatCapacityOutboxDeadLettered
          expr: |
            sum by (action) (multica_seat_capacity_outbox_dead_lettered) > 0
          for: {{ .Values.monitoring.prometheusRule.seatCapacityDeadLetteredFor | quote }}
          labels:
            severity: {{ .Values.monitoring.prometheusRule.severity | quote }}
          annotations:
            summary: "Seat capacity intent requires repair"
            description: "At least one {{ "{{ $labels.action }}" }} seat capacity intent exhausted automatic retries and entered the dead-letter state."
        - alert: MulticaSeatCapacityOutboxStalled
          expr: |
            max by (action) (multica_seat_capacity_outbox_oldest_pending_age_seconds)
              > {{ .Values.monitoring.prometheusRule.seatCapacityPendingAgeSeconds }}
          for: {{ .Values.monitoring.prometheusRule.seatCapacityPendingFor | quote }}
          labels:
            severity: {{ .Values.monitoring.prometheusRule.severity | quote }}
          annotations:
            summary: "Seat capacity outbox is stalled"
            description: "The oldest {{ "{{ $labels.action }}" }} seat capacity intent has remained unsettled beyond the configured age threshold. Repeated Cloud or proxy 429 deferrals intentionally remain pending and surface here instead of in the dead-letter alert."
{{- end }}
