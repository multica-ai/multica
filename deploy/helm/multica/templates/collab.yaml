{{- if include "multica.collab.enabled" . -}}
{{- $image := default dict .Values.images.collab -}}
{{- $collabImageTag := default .Chart.AppVersion $image.tag -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "multica.collab.fullname" . }}
  labels:
    {{- include "multica.labels" . | nindent 4 }}
    app.kubernetes.io/component: collab
spec:
  # Every open doc lives in this process's memory, so a second replica would
  # hold its own copy of the same doc. Recreate keeps a rollout from running
  # two at once.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: multica
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: collab
  template:
    metadata:
      annotations:
        # Same lookup as the backend: both must roll when COLLAB_SECRET rotates.
        checksum/secret: {{ (lookup "v1" "Secret" .Release.Namespace .Values.existingSecret).data | toYaml | sha256sum }}
      labels:
        {{- include "multica.labels" . | nindent 8 }}
        app.kubernetes.io/component: collab
    spec:
      # On SIGTERM the service takes up to 15s to store every open doc.
      terminationGracePeriodSeconds: 30
      containers:
        - name: collab
          image: "{{ default "ghcr.io/multica-ai/multica-collab" $image.repository }}:{{ $collabImageTag }}"
          imagePullPolicy: {{ default "IfNotPresent" $image.pullPolicy }}
          ports:
            - containerPort: 8095
              name: http
          env:
            - name: COLLAB_PORT
              value: "8095"
            - name: MULTICA_API_URL
              value: {{ printf "http://%s:8080" (include "multica.backend.fullname" .) | quote }}
            - name: MULTICA_CDN_DOMAIN
              value: {{ include "multica.collab.cdnDomain" . | quote }}
            - name: COLLAB_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: COLLAB_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: 8095
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8095
            initialDelaySeconds: 30
            periodSeconds: 30
          {{- with .Values.collab.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.collab.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.collab.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "multica.collab.fullname" . }}
  labels:
    {{- include "multica.labels" . | nindent 4 }}
    app.kubernetes.io/component: collab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: multica
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: collab
  ports:
    - port: 8095
      targetPort: 8095
      name: http
{{- end }}
