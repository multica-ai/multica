# Deployment compose cho VPS dùng CHUNG máy với một stack khác đã chiếm 80/443.
#
# Khác docker-compose.selfhost.yml ở đúng 3 điểm, tất cả đều bắt buộc khi ở chung máy:
#
#  1. Tên service là hira-web / hira-api / hira-db (KHÔNG phải frontend/backend/postgres).
#     Compose gán tên service làm network alias trên MỌI network mà container tham gia.
#     Stack hàng xóm đã có alias `frontend` và `postgres` trên network của nó; nếu Caddy
#     dùng chung network mà thấy hai alias `frontend`, DNS trả về 2 địa chỉ và traffic của
#     hàng xóm bị round-robin sang đây. Đổi tên service là cách duy nhất loại bỏ rủi ro này
#     tận gốc (override file không đổi được tên service).
#
#  2. Alias theo từng network. Image multica-web:dev bake sẵn Next.js rewrite tới
#     http://backend:8080, và DATABASE_URL trỏ tới host `postgres` — nên hai alias đó được
#     cấp LẠI, nhưng CHỈ trên network nội bộ. Chúng không lộ ra network dùng chung.
#
#  3. Chỉ hira-web và hira-api tham gia network `edge` (external, của stack hàng xóm) để
#     Caddy gọi được. hira-db KHÔNG bao giờ ra khỏi network nội bộ.
#
# Chạy:  docker compose -f deploy/hira2/docker-compose.vps.yml up -d

name: hira2

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  hira-db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-multica}
      POSTGRES_USER: ${POSTGRES_USER:-multica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Loopback ONLY. Docker chèn iptables rule trước UFW: "5434:5432" sẽ phơi
      # Postgres ra thẳng Internet dù UFW đang active.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    networks:
      internal:
        aliases:
          - postgres
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-multica} -d ${POSTGRES_DB:-multica}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  hira-api:
    image: ${HIRA_BACKEND_IMAGE:-multica-backend:dev}
    depends_on:
      hira-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8081}:8080"
    volumes:
      - backend_uploads:/app/data/uploads
    networks:
      internal:
        aliases:
          - backend
      edge:
    restart: unless-stopped
    logging: *logging
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-multica}:${POSTGRES_PASSWORD:-multica}@postgres:5432/${POSTGRES_DB:-multica}?sslmode=disable
      PORT: "8080"
      METRICS_ADDR: ${METRICS_ADDR:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:${FRONTEND_PORT:-3000}}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@multica.ai}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS: ${SMTP_TLS:-}
      SMTP_TLS_INSECURE: ${SMTP_TLS_INSECURE:-false}
      SMTP_EHLO_NAME: ${SMTP_EHLO_NAME:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:${FRONTEND_PORT:-3000}/auth/callback}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-west-2}
      # Static credentials for S3-compatible backends (Cloudflare R2, MinIO,
      # Backblaze B2, Wasabi). REQUIRED for self-host: without them the AWS SDK
      # falls back to the (empty) default credential chain and every PutObject
      # is unauthenticated, so uploads fail with HTTP 500 even though S3_BUCKET
      # is set. AWS-hosted deployments that use an instance/task IAM role can
      # leave these empty.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      ATTACHMENT_DOWNLOAD_MODE: ${ATTACHMENT_DOWNLOAD_MODE:-auto}
      ATTACHMENT_DOWNLOAD_URL_TTL: ${ATTACHMENT_DOWNLOAD_URL_TTL:-30m}
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN:-}
      CLOUDFRONT_KEY_PAIR_ID: ${CLOUDFRONT_KEY_PAIR_ID:-}
      CLOUDFRONT_PRIVATE_KEY: ${CLOUDFRONT_PRIVATE_KEY:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      APP_ENV: ${APP_ENV:-production}
      MULTICA_DEV_VERIFICATION_CODE: ${MULTICA_DEV_VERIFICATION_CODE:-}
      MULTICA_APP_URL: ${MULTICA_APP_URL:-http://localhost:${FRONTEND_PORT:-3000}}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      DISABLE_WORKSPACE_CREATION: ${DISABLE_WORKSPACE_CREATION:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      # Public URL the API is reachable at from the open internet, no
      # trailing slash. Used to mint absolute webhook URLs for autopilot
      # webhook triggers. Leave unset behind a same-origin reverse proxy
      # (e.g. plain localhost dev); the frontend will compose the URL
      # from window.origin + webhook_path in that case. Headers are
      # intentionally NOT used to derive this value, to avoid Host /
      # X-Forwarded-Host spoofing on misconfigured proxies.
      MULTICA_PUBLIC_URL: ${MULTICA_PUBLIC_URL:-}
      # Comma-separated CIDRs whose source IP is allowed to set
      # X-Forwarded-For / X-Real-IP for the webhook per-IP rate limiter.
      # Empty default = headers ignored, RemoteAddr used. Set e.g.
      # "127.0.0.1/32" when running behind a same-host reverse proxy.
      MULTICA_TRUSTED_PROXIES: ${MULTICA_TRUSTED_PROXIES:-}
      # Lark / Feishu bot integration. MULTICA_LARK_SECRET_KEY is the
      # opt-in: unset = integration disabled. Mainland 飞书 and international
      # Lark are auto-detected per installation and served side by side, so
      # the two base-URL knobs should normally stay EMPTY. They are optional
      # deployment-wide overrides that force every installation onto one host
      # (proxy / mock / single-cloud staging). Upgrading from a setup that
      # used https://open.larksuite.com here? The server relabels existing
      # installs to region=lark on first boot, then you can clear them.
      # See docs/lark-bot-integration.
      MULTICA_LARK_SECRET_KEY: ${MULTICA_LARK_SECRET_KEY:-}
      MULTICA_LARK_HTTP_BASE_URL: ${MULTICA_LARK_HTTP_BASE_URL:-}
      MULTICA_LARK_CALLBACK_BASE_URL: ${MULTICA_LARK_CALLBACK_BASE_URL:-}

  hira-web:
    image: ${HIRA_WEB_IMAGE:-multica-web:dev}
    depends_on:
      - hira-api
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3001}:3000"
    environment:
      HOSTNAME: "0.0.0.0"
    networks:
      internal:
      edge:
    restart: unless-stopped
    logging: *logging

networks:
  internal:
  edge:
    # Network của stack hàng xóm — Caddy của nó đã nằm sẵn ở đây.
    name: ${EDGE_NETWORK:-lumi-prod_default}
    external: true

volumes:
  pgdata:
  backend_uploads:
