<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
<style>
.t0{animation:tw 4s ease-in-out infinite}
.t1{animation:tw 6s ease-in-out -2s infinite}
.t2{animation:tw 9s ease-in-out -5s infinite}
.ga{animation:drift 90s ease-in-out infinite alternate}
.gb{animation:drift 120s ease-in-out -40s infinite alternate-reverse}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes drift{from{transform:translate(-120px,-40px)}to{transform:translate(140px,60px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe0ff"/><stop offset="1" stop-color="#fde6d8"/></linearGradient>
<radialGradient id="ga"><stop offset="0" stop-color="#ffb38a" stop-opacity=".55"/><stop offset="1" stop-color="#ffb38a" stop-opacity="0"/></radialGradient>
<radialGradient id="gb"><stop offset="0" stop-color="#8fb6ff" stop-opacity=".45"/><stop offset="1" stop-color="#8fb6ff" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1600" height="1000" fill="url(#sky)"/>
<circle class="ga" cx="320" cy="260" r="520" fill="url(#ga)"/>
<circle class="gb" cx="1280" cy="380" r="560" fill="url(#gb)"/>
