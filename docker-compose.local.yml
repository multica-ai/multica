# Fully local Multica stack.
#
# The application images are built from this checkout. At runtime, PostgreSQL,
# Redis, email delivery, analytics, and uploads all stay on this machine.
# Use scripts/local-stack.sh or scripts/local-stack.ps1 to initialize secrets
# and operate the stack.

name: multica-local

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-multica}
      POSTGRES_USER: ${POSTGRES_USER:-multica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-multica-local}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-multica} -d ${POSTGRES_DB:-multica}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8.8.1-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.30.0
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpitdata:/data
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "5000"
      MP_DISABLE_VERSION_CHECK: "true"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  backend:
    image: multica-backend:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-local}
        COMMIT: ${COMMIT:-local}
        DATE: ${DATE:-local}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend_uploads:/app/data/uploads
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-multica}:${POSTGRES_PASSWORD:-multica-local}@postgres:5432/${POSTGRES_DB:-multica}?sslmode=disable
      PORT: "8080"
      APP_ENV: production
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-random-jwt-secret}
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-3000}
      MULTICA_APP_URL: http://localhost:${FRONTEND_PORT:-3000}
      MULTICA_PUBLIC_URL: http://localhost:${BACKEND_PORT:-8080}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}

      # Local SMTP capture. Login codes are visible in the Mailpit UI.
      RESEND_API_KEY: ""
      RESEND_FROM_EMAIL: noreply@multica.local
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_FROM_EMAIL: noreply@multica.local
      SMTP_TLS: ""
      SMTP_TLS_INSECURE: "false"
      SMTP_EHLO_NAME: multica.local

      # Local persistent upload storage; no S3 service is required.
      S3_BUCKET: ""
      AWS_ENDPOINT_URL: ""
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      LOCAL_UPLOAD_DIR: /app/data/uploads
      LOCAL_UPLOAD_BASE_URL: http://localhost:${BACKEND_PORT:-8080}
      ATTACHMENT_DOWNLOAD_MODE: proxy

      # Local Redis provides rate limiting, caches, and realtime fan-out.
      REDIS_URL: redis://redis:6379/0
      REDIS_DISABLE_CLIENT_NAME: "false"

      # Disable outbound product analytics for the local stack.
      ANALYTICS_DISABLED: "true"
      POSTHOG_API_KEY: ""
      POSTHOG_HOST: ""

      # The base stack makes no server-side LLM calls. The optional AI
      # overlay replaces these values with a local Ollama endpoint.
      MULTICA_LLM_API_KEY: ""
      MULTICA_LLM_BASE_URL: ""
      MULTICA_LLM_DEFAULT_MODEL: ""

      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      DISABLE_WORKSPACE_CREATION: ${DISABLE_WORKSPACE_CREATION:-}

      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      GOOGLE_REDIRECT_URI: http://localhost:${FRONTEND_PORT:-3000}/auth/callback
      GITHUB_APP_SLUG: ""
      GITHUB_WEBHOOK_SECRET: ""
      GITHUB_APP_ID: ""
      GITHUB_APP_PRIVATE_KEY: ""

      MULTICA_VCS_INTEGRATION_ENABLED: "true"
      MULTICA_VCS_SECRET_KEY: ${MULTICA_VCS_SECRET_KEY:-replace-with-a-random-base64-key}
      MULTICA_LARK_SECRET_KEY: ""
      MULTICA_SLACK_SECRET_KEY: ""
      MULTICA_DINGTALK_SECRET_KEY: ""
      MULTICA_WECOM_SECRET_KEY: ""
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8080/healthz",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  frontend:
    image: multica-web:local
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_APP_VERSION: ${VERSION:-local}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    environment:
      HOSTNAME: 0.0.0.0
      REMOTE_API_URL: http://backend:8080
      DOCS_URL: ""
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_WS_URL: ""
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata: {}
  redisdata: {}
  backend_uploads: {}
  mailpitdata: {}
