# Per-workspace ExternalSecret template. See proposal §4 + §6.
#
# This file is the *shape* the controller stamps out — the controller
# does NOT apply this manifest directly (the metadata.name placeholder
# would never resolve). At runtime the controller reads this template,
# substitutes <wsId>, and creates one ExternalSecret per workspace.
#
# Committing the template here gives reviewers something to audit
# without forcing per-workspace ExternalSecrets into Git (where they'd
# churn on every workspace add/delete).
#
# Each per-workspace ExternalSecret pulls /agentfarm/tools/daemons/<wsId>/*
# from SSM into Secret agentfarm-daemon-<wsId>-secrets. The keys the
# controller writes there alongside the SSM-sourced ones are:
#
#   MULTICA_TOKEN          — workspace-scoped daemon PAT (see proposal §8)
#   MULTICA_SERVER_URL     — server URL
#   ANTHROPIC_API_KEY      — LiteLLM-minted virtual key (Anthropic)
#   ANTHROPIC_BASE_URL     — LiteLLM proxy's Anthropic-compatible endpoint
#   OPENAI_API_KEY         — LiteLLM-minted virtual key (OpenAI)
#   OPENAI_BASE_URL        — LiteLLM proxy's OpenAI-compatible endpoint
#
# The MULTICA_TOKEN, ANTHROPIC_*, OPENAI_* values are written by the
# controller itself (after minting against the agentfarm server and
# LiteLLM, respectively); they don't come from SSM. The SSM-sourced
# values via dataFrom are workspace-specific overrides an operator
# might set (e.g. MULTICA_DAEMON_MAX_CONCURRENT_TASKS for a heavy
# workspace).

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  # PLACEHOLDER — controller renders this per workspace.
  name: agentfarm-daemon-WORKSPACE_ID-secrets
  labels:
    app: agentfarm
    component: daemon
    agentfarm.workspace: WORKSPACE_ID
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: secretstore-aws-ssm
    kind: ClusterSecretStore
  target:
    name: agentfarm-daemon-WORKSPACE_ID-secrets
    creationPolicy: Owner
    # ESO's `dataFrom.find` writes only the keys it pulled from SSM;
    # the additional fields the controller writes directly via the k8s
    # API (MULTICA_TOKEN, the LiteLLM-minted ANTHROPIC_*/OPENAI_* keys)
    # survive ESO refreshes by default.
  dataFrom:
    - find:
        name:
          regexp: "(?i)^/agentfarm/tools/daemons/WORKSPACE_ID/.*"
      rewrite:
        - regexp:
            source: "(?i)^/agentfarm/tools/daemons/WORKSPACE_ID/(.*)"
            target: "$1"
