# Controller-scoped Secret. See proposal §7.
#
# Pulls the LiteLLM Management Key (NOT master key) and proxy URL from
# /agentfarm/tools/runtime-controller/* into a controller-only Secret.
# The Management Key is minted out-of-band on the LiteLLM proxy with
# permissions limited to:
#   - team/{new,update,delete}
#   - key/{generate,update,delete} (only on teams it created)
#   - spend reads
# So if the key leaks, blast radius is "agentfarm teams + the keys we
# ourselves minted" — not the entire LiteLLM proxy.
#
# This Secret never reaches a per-workspace pod. The per-workspace
# daemon Secret carries virtual keys minted from this Management Key,
# not the Management Key itself.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentfarm-runtime-controller-secrets
  labels:
    app: agentfarm
    component: runtime-controller
  annotations:
    # Reloader rolls the controller pod when the SSM-sourced values
    # change — so a Management Key rotation propagates automatically.
    reloader.stakater.com/auto: "true"
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: secretstore-aws-ssm
    kind: ClusterSecretStore
  target:
    name: agentfarm-runtime-controller-secrets
    creationPolicy: Owner
  dataFrom:
    - find:
        name:
          regexp: "(?i)^/agentfarm/tools/runtime-controller/.*"
      rewrite:
        - regexp:
            source: "(?i)^/agentfarm/tools/runtime-controller/(.*)"
            target: "$1"
