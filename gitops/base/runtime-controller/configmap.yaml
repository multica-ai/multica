# Shared daemon defaults, mounted into every per-workspace daemon pod.
# See proposal §6.
#
# These values override the daemon's local-machine defaults (which are
# tuned for laptops with hundreds of GiB free). Concurrency is locked
# at 2 to give clean backpressure rather than OOM-kills under the
# per-pod resource budget; GC TTLs are tightened for the 10 GiB PVC.
# The smoke test in rollout step 1 validates the budget; if there's
# headroom we raise MULTICA_DAEMON_MAX_CONCURRENT_TASKS here.

apiVersion: v1
kind: ConfigMap
metadata:
  name: agentfarm-daemon-defaults
  labels:
    app: agentfarm
    component: runtime-controller
data:
  # Concurrency: locked at 2 — see proposal §6. With 1 GiB memory limits
  # and two CLIs (claude + codex) each consuming ~200-400 MiB under load,
  # 2 concurrent tool calls fit with margin. Daemon backpressures rather
  # than accept-and-OOM-kill at 20.
  MULTICA_DAEMON_MAX_CONCURRENT_TASKS: "2"

  # GC: tightened for 10 GiB PVC. Binary defaults (24h TTL workdir,
  # 12h artifact TTL) assume laptop-scale free space.
  MULTICA_GC_TTL: "6h"
  MULTICA_GC_ARTIFACT_TTL: "2h"

  # Same as binary defaults; called out so they're centrally tunable
  # instead of being implicit.
  MULTICA_DAEMON_POLL_INTERVAL: "3s"
  MULTICA_DAEMON_HEARTBEAT_INTERVAL: "15s"
  MULTICA_AGENT_TIMEOUT: "2h"
