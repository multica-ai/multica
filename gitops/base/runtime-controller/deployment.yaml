# agentfarm-runtime-controller — reconciles per-workspace daemon
# runtimes. See proposal §1.
#
# Single replica with leader election. Same security posture as the
# backend Deployment (non-root, read-only rootfs, drop ALL caps).
# arm64 / karpenter `shared` nodepool to match images built linux/arm64
# only.
#
# v1 ships in observe-only mode: --dry-run gates every external write
# (k8s API, Crossplane CR, LiteLLM API, server PAT mint, ec2:DeleteVolume).
# Reads run normally so the controller's "what would change" view is
# grounded in real state. Flip to write mode by removing --dry-run from
# args and rolling the pod. See proposal §"Rollout" step 2.

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentfarm-runtime-controller
  labels:
    app: agentfarm
    component: runtime-controller
  annotations:
    # Sync after the IAM Role this Deployment's IRSA depends on (wave 1
    # by default for Crossplane resources). Wave 5 = "after backend
    # plus the controller's own IAM is reconciled".
    argocd.argoproj.io/sync-wave: "5"
spec:
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: leader election makes a second
    # replica unnecessary, and the in-flight reconcile state isn't
    # worth a graceful overlap window.
    type: Recreate
  selector:
    matchLabels:
      app: agentfarm
      component: runtime-controller
  template:
    metadata:
      labels:
        app: agentfarm
        component: runtime-controller
      annotations:
        # Roll on Management Key / proxy URL change (10m SSM refresh).
        reloader.stakater.com/auto: "true"
    spec:
      serviceAccountName: agentfarm-runtime-controller
      imagePullSecrets:
        - name: regcred
      # Match backend/web nodepool: arm64 only, images built linux/arm64.
      nodeSelector:
        karpenter.sh/nodepool: shared
        kubernetes.io/arch: arm64
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: ghcr.io/g2crowd/agentfarm-runtime-controller-prod
          imagePullPolicy: IfNotPresent
          args:
            # Observe-only by default. Remove this arg (or set to false)
            # to enable writes. Promoted to a real flag rather than a
            # vague "observe-only mode" — see proposal §"Rollout" step 2.
            - "--dry-run=true"
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          envFrom:
            # Management Key + LiteLLM proxy URL (see externalsecret-controller.yaml).
            - secretRef:
                name: agentfarm-runtime-controller-secrets
          env:
            - name: MULTICA_SERVER_URL
              value: "https://agentfarm.g2.com"
            # Discovery cadence — how often the controller polls
            # /v1/workspaces?has_runtime=true.
            - name: WORKSPACE_POLL_INTERVAL
              value: "30s"
            # Image the controller stamps into every per-workspace
            # Deployment. Bumping the daemon image is a one-line change
            # in this env (and in the kustomization image-tag pin).
            - name: DAEMON_IMAGE
              value: "ghcr.io/g2crowd/agentfarm-daemon-prod"
            - name: DAEMON_IMAGE_TAG
              value: "latest"
            # OIDC provider ARN for IRSA — the WorkspaceIAM Composition
            # references this in the trust policy of every per-workspace
            # role. Pulled from cluster config rather than hardcoded so
            # a cluster swap doesn't require a manifest edit.
            - name: IRSA_OIDC_PROVIDER_ARN
              value: "arn:aws:iam::637423279283:oidc-provider/oidc.eks.us-east-1.amazonaws.com/id/A91661D1C094FD09EF6DF908DE864264"
            # AWS region for ec2:DeleteVolume calls.
            - name: AWS_REGION
              value: "us-east-1"
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
