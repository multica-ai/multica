# Pulls every `agentfarm`-tagged item from the squad's 1Password vault into a
# dedicated Secret, kept separate from agentrunner-secrets (SSM-backed) so a
# 2nd envFrom can be added without touching the existing ESO (AIPLAT-106).
#
# Field-key mapping (verified against external-secrets onepasswordsdk provider
# source, GetAllSecrets/getAllFields): the k8s Secret key is the 1Password
# item FIELD TITLE verbatim — no item-name prefix, no case transform, no
# rewrite applied by the provider. Two tagged items sharing a field title is a
# hard ESO error ("found multiple labels with the same key"). Consequently:
# whoever authors `agentfarm`-tagged items in a squad vault MUST (a) name each
# field exactly as the desired env var (e.g. `DATABASE_URL`, not
# `database url`) and (b) keep field titles unique across every
# `agentfarm`-tagged item in that vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentrunner-1password-secrets
  annotations:
    reloader.stakater.com/match: "true"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: onepassword-squad-vault
    kind: SecretStore
  target:
    name: agentrunner-1password-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
  dataFrom:
    - find:
        tags:
          agentfarm: "" # value unused; presence = match
