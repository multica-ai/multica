# Per-runner SecretStore bound to the workspace's squad vault (AIPLAT-106).
# `vault` is a static per-manifest field in the onepasswordSDK provider — the
# ApplicationSet patches PLACEHOLDER_VAULT to the vault slug parsed out of the
# composite registry key (goTemplate splitList "." .slug).
#
# Auth token: rather than a dedicated bootstrap ExternalSecret, this points at
# the ONEPASSWORD_SA_TOKEN key already present in the existing agentrunner-secrets
# Secret (swept in from the shared SSM bucket by agent-runtime/external-secret.yaml
# dataFrom[1]). One shared 1Password service account covers every squad vault.
# Trade-off accepted (see AIPLAT-106): the token is therefore also exposed as a
# plain env var inside the runner container's own process env via envFrom.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: onepassword-squad-vault
spec:
  provider:
    onepasswordSDK:
      vault: PLACEHOLDER_VAULT
      auth:
        serviceAccountSecretRef:
          name: agentrunner-secrets
          key: ONEPASSWORD_SA_TOKEN
