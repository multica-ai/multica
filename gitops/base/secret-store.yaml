apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentfarm-secret-store
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: secretstore-aws-ssm
    kind: ClusterSecretStore
  target:
    creationPolicy: Owner
  data:
    # Reuses the Enterprise Platform Bot's private key (same App as
    # agent-runtime's git credential minting) instead of duplicating it —
    # see gitops/base/agent-runtime/external-secret.yaml.
    - secretKey: GITHUB_APP_PRIVATE_KEY
      remoteRef:
        key: /infra/g2-enterprise-platform-bot
    # LLMPROXY_MASTER_KEY has a user_id (LITELLM_API_KEY's own value doesn't),
    # avoiding the /key/list 403s.
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: /agentfarm/tools/LLMPROXY_MASTER_KEY
  dataFrom:
    - find:
        path: /agentfarm/tools
        name:
          regexp: "(?i)^/agentfarm/tools/[^/]+$"
      rewrite:
        - regexp:
            source: "(?i)^/agentfarm/tools/(.*)"
            target: "$1"
