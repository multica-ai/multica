---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentfarm-web
  namespace: agentfarm
  labels:
    app: agentfarm
    component: web
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: agentfarm
      component: web
  template:
    metadata:
      labels:
        app: agentfarm
        component: web
      annotations:
        # Reloader rolls pods when agentfarm-secret-store changes (10m SSM refresh).
        reloader.stakater.com/auto: "true"
    spec:
      serviceAccountName: agentfarm
      imagePullSecrets:
        - name: regcred
      # EKS Auto Mode, Karpenter `shared` pool (arm64 variant, Graviton).
      # See deployment-backend.yaml for rationale (images are arm64-only,
      # devops pool is amd64-only, shared is the tools-cluster arm64 path).
      nodeSelector:
        karpenter.sh/nodepool: shared
        kubernetes.io/arch: arm64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/g2crowd/agentfarm-web-prod
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - secretRef:
                name: agentfarm-secret-store
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: 0.0.0.0
          # No /health endpoint on the Next.js app — use TCP socket probes.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: next-cache
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
