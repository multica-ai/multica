apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentfarm
  labels:
    app: agentfarm
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    # WebSocket + long-poll support: keep connections alive for up to
    # 1 hour.  Without these, nginx defaults to 60s which races against
    # the server's 54s WS ping interval and severs daemon long-poll
    # endpoints (/api/daemon/runtimes/*/tasks/pending, etc.).
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Match the Go backend's 100 MB upload cap (handler/file.go).
    # nginx defaults to 1 MB and returns 413 before Go ever sees it.
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($http_x_forwarded_proto = 'http') {
        return 301 https://$host$request_uri;
      }
    external-dns.alpha.kubernetes.io/hostname: agentfarm.g2.com
    external-dns.alpha.kubernetes.io/ttl: "300"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    nginx.ingress.kubernetes.io/whitelist-source-range: "173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
spec:
  ingressClassName: nginx-external
  rules:
    - host: agentfarm.g2.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentfarm-web
                port:
                  name: http
