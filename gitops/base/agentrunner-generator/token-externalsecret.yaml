apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentrunner-generator-token
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secretstore-aws-ssm
    kind: ClusterSecretStore
  target:
    name: agentrunner-generator-token
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: token
      remoteRef:
        key: /agentfarm/tools/plugin-token
