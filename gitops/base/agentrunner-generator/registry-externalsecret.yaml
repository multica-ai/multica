apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentrunner-registry
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: secretstore-aws-ssm
    kind: ClusterSecretStore
  target:
    name: agentrunner-registry
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      metadata:
        labels:
          ephemeral-env-generator/type: registry
  dataFrom:
    - find:
        path: /agentfarm/tools/agentrunner
        name:
          regexp: "^/agentfarm/tools/agentrunner/[^/]+$"
      rewrite:
        - regexp:
            source: "/agentfarm/tools/agentrunner/(.*)"
            target: "$1"
