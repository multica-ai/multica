apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentrunner
  annotations:
    # IRSA. Without this the runner pod has no AWS identity at all: no projected
    # web-identity token is mounted, IMDS is unreachable, and every AWS call made
    # from inside a session fails at authentication (AIPLAT-169).
    #
    # The account is hardcoded rather than patched per environment because this
    # whole directory is dev-cluster-only — external-secret.yaml already pins
    # /agentfarm/development/... in base for the same reason, and no agentrunner
    # namespace exists on the tools cluster. The role is declared in
    # gitops/environments/development/infra/iam-agentrunner.yaml; its trust
    # policy accepts system:serviceaccount:agentrunner-*:agentrunner, so it
    # covers every workspace slug the appset generates without further edits.
    #
    # The mutating pod-identity webhook injects AWS_ROLE_ARN and
    # AWS_WEB_IDENTITY_TOKEN_FILE at pod creation, so an already-running pod must
    # be recreated to pick this up.
    eks.amazonaws.com/role-arn: arn:aws:iam::975049976121:role/agentfarm-agentrunner-role
