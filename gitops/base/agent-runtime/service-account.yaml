apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentrunner
  annotations:
    # IRSA. Without this the runner pod has no AWS identity at all: no projected
    # web-identity token is mounted, IMDS is unreachable, and every AWS call made
    # from inside a session fails at authentication (AIPLAT-169).
    #
    # PLACEHOLDER here (rather than a literal role name) because each workspace
    # gets its own Role now, scoped to its own S3 prefix — see
    # gitops/base/agent-runtime/iam-agentrunner.yaml. The appset patches this
    # annotation to the workspace-specific role ARN per Application, the same
    # way it already patches Namespace/metadata/name.
    #
    # The mutating pod-identity webhook injects AWS_ROLE_ARN and
    # AWS_WEB_IDENTITY_TOKEN_FILE at pod creation, so an already-running pod must
    # be recreated to pick this up.
    eks.amazonaws.com/role-arn: arn:aws:iam::975049976121:role/agentfarm-agentrunner-role-PLACEHOLDER
