# Per-workspace 1Password SecretStore. The vault name is a placeholder that the
# ApplicationSet (g2crowd/configuration, agentrunner-generator/agentrunner-dev-generator)
# replaces per Application from the workspace's registry entry (SSM key
# /agentfarm/tools/agentrunner-dev/<slug> or /agentfarm/tools/agentrunner/<slug>, JSON
# value {"onepassword_vault": "vault-name"}).
#
# No `onepassword_vault` in the registry entry -> the ApplicationSet's templatePatch
# deletes this resource outright instead of patching it, so no lookup happens at all
# (AIPLAT-161). This file's PLACEHOLDER_VAULT never reaches a live vault: it either
# gets replaced with a real vault name, or the whole resource is deleted before
# ArgoCD applies it.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: onepassword-squad-vault
spec:
  provider:
    onepasswordSDK:
      vault: PLACEHOLDER_VAULT
      auth:
        serviceAccountSecretRef:
          name: agentrunner-secrets
          key: ONEPASSWORD_SA_TOKEN
