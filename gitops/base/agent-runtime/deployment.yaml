apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentrunner
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentrunner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentrunner
    spec:
      serviceAccountName: agentrunner
      imagePullSecrets:
        - name: regcred
      containers:
        - name: opencode
          image: ghcr.io/g2crowd/agentrunner-runtime-prod
          imagePullPolicy: Always
          env:
            - name: WORKSPACE_SLUG
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ATLASSIAN_SITE
              value: https://g2crowd.atlassian.net
            - name: DEFAULT_GIT_REPO
              value: "https://github.com/g2crowd/ai-enhancement-hub,https://github.com/g2crowd/ue,https://github.com/g2crowd/companies_service"
            # Platform Bot GitHub App — non-secret identifiers used by
            # git-credential-platform-bot to mint installation tokens. The
            # private key (GITHUB_APP_PRIVATE_KEY) arrives via the
            # agentrunner-secrets envFrom below.
            - name: GITHUB_APP_ID
              value: "859473"
            - name: GITHUB_APP_INSTALLATION_ID
              value: "48670491"
            # Bot git identity. Declared here (not via the secret) so it takes
            # precedence over any GIT_USER_* swept in through envFrom — commits
            # from runner agents are attributed to the bot, not the requester.
            - name: GIT_USER_NAME
              value: "g2-platform-bot[bot]"
            - name: GIT_USER_EMAIL
              value: "g2-platform-bot[bot]@users.noreply.github.com"
          envFrom:
            - secretRef:
                name: agentrunner-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: eks.amazonaws.com/compute-type
                    operator: NotIn
                    values:
                      - auto
                      - fargate
      tolerations:
        - key: CostCenter
          operator: Equal
          value: shared
          effect: NoSchedule
        - key: CostCenter
          operator: Equal
          value: Devops
          effect: NoSchedule
