apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentrunner
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # Default (600s) is shorter than preflight can legitimately take (~20 min) —
  # without this, a normal slow start reports as a stalled/degraded rollout
  # (ArgoCD, kubectl rollout status) even though the pod is fine.
  progressDeadlineSeconds: 1800
  selector:
    matchLabels:
      app.kubernetes.io/name: agentrunner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentrunner
      annotations:
        # Each pod is a singleton, in-memory coding session with no
        # checkpoint/resume — cluster-autoscaler consolidation looks only at
        # requested cpu/memory (never live usage), so a node hosting an
        # actively-spiking session can still be picked as underutilized and
        # drained. This stops that: never a scale-down eviction target.
        # Paired with the PDB in pdb.yaml (belt-and-suspenders — see AIPLAT-153).
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      # entrypoint.sh (AIPLAT-168) holds SIGTERM and drains in-flight agent
      # tasks (polling active_task_count) before forwarding it to the daemon,
      # up to a ~9.5 min cap — this must exceed that cap plus the daemon's own
      # teardown (~30s taskWG wait + subprocess grace) or kubelet SIGKILLs
      # mid-drain.
      terminationGracePeriodSeconds: 660
      serviceAccountName: agentrunner
      imagePullSecrets:
        - name: regcred
      # fsGroup so the tmpfs-backed secrets volume below is group-writable by
      # the non-root `agent` user (uid/gid 1000 in agent-runtime-base/Dockerfile) —
      # emptyDir volumes are otherwise created root-owned and entrypoint.sh's
      # `chmod 700 "${SECRETS_DIR}"` would fail with EPERM.
      securityContext:
        fsGroup: 1000
      containers:
        - name: opencode
          image: ghcr.io/g2crowd/agentrunner-runtime-prod
          imagePullPolicy: Always
          env:
            - name: ATLASSIAN_SITE
              value: https://g2crowd.atlassian.net
            - name: DEFAULT_GIT_REPO
              value: "https://github.com/g2crowd/ai-enhancement-hub,https://github.com/g2crowd/ue,https://github.com/g2crowd/companies_service"
            # Enterprise Platform Bot GitHub App — installed in both g2crowd and
            # gartner-digital-markets, enabling cross-org repo access.
            # The credential helper resolves the correct installation ID
            # dynamically at mint time, so no per-org installation ID is needed.
            # The private key (GITHUB_APP_PRIVATE_KEY) arrives via the
            # agentrunner-secrets envFrom below.
            # TODO: replace with G2 Enterprise Platform Bot app ID once confirmed.
            - name: GITHUB_APP_ID
              value: "4153447"
            # Fallback org for gh CLI invocations that run outside a git checkout.
            # Dynamic installation discovery covers the git credential path without
            # this; it is only needed when the gh wrapper cannot detect a remote.
            - name: GITHUB_DEFAULT_ORG
              value: "g2crowd"
            # Bot git identity. Declared here (not via the secret) so it takes
            # precedence over any GIT_USER_* swept in through envFrom — commits
            # from runner agents are attributed to the bot, not the requester.
            # TODO: update to Enterprise Bot identity once confirmed.
            - name: GIT_USER_NAME
              value: "g2-enterprise-platform-bot[bot]"
            - name: GIT_USER_EMAIL
              value: "g2-enterprise-platform-bot[bot]@users.noreply.github.com"
          envFrom:
            - secretRef:
                name: agentrunner-secrets
          volumeMounts:
            # tmpfs-backed so PEM secrets entrypoint.sh materializes under
            # ~/.secrets (ROIPPC-2) live in RAM only, never the node's disk.
            - name: secrets
              mountPath: /home/agent/.secrets
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            # The daemon's health port is loopback-only (it also carries
            # unauthenticated /shutdown and /repo/checkout — see
            # server/internal/daemon/health.go), so the kubelet's httpGet can't
            # reach it from the pod IP. Uses the daemon's own CLI instead of
            # hand-rolled curl, so it stays correct if the health port or
            # response shape ever changes. "starting" (PAT renew + workspace
            # sync + runtime registration) can take 10-20 min; no livenessProbe,
            # since that window would otherwise crash-loop the pod.
            exec:
              command:
                - sh
                - -c
                - '[ "$(multica daemon status --output json | jq -r .status)" = "running" ]'
            initialDelaySeconds: 15
            periodSeconds: 15
            # This is an exec probe: forking sh, multica, and jq costs real
            # CPU-scheduling time on top of the check logic itself. Under the
            # node-CPU contention this pod template's topologySpreadConstraint
            # (above) targets, that fork/exec chain alone can burn several
            # seconds before the daemon's own status logic ever runs — a
            # too-tight timeout fails the probe on scheduling latency, not on
            # the daemon actually being unready (AIPLAT-162). Kept comfortably
            # under periodSeconds so a slow attempt can't overlap the next tick.
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: secrets
          emptyDir:
            medium: Memory
            # Generous headroom over the handful of PEM keys this ever holds;
            # small enough to be a non-issue against the 2Gi pod memory limit.
            sizeLimit: 16Mi
      # Every workspace is a separate Deployment (replicas: 1) sharing this same
      # pod template, so the scheduler's request-based bin-packing (500m request
      # vs 2 CPU limit — a 4x burst allowance) can and does stack several
      # concurrently-booting pods from different workspaces onto the same node
      # during a fleet-wide rollout, saturating its CPU and blowing every
      # provider's version-detection timeout (AIPLAT-162). DoNotSchedule (not
      # ScheduleAnyway) so this is an enforced spread, not just a preference —
      # the cluster-autoscaler already has headroom to max_size=12 nodes and
      # will scale up to satisfy it rather than stack pods.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: agentrunner
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: eks.amazonaws.com/compute-type
                    operator: NotIn
                    values:
                      - auto
                      - fargate
      tolerations:
        - key: CostCenter
          operator: Equal
          value: agentrunner
          effect: NoSchedule
