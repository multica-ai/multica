apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentrunner
  annotations:
    # Reloader's `/auto` mode doesn't reliably pick up updates the External
    # Secrets Operator writes to a Secret it owns — every other ESO-backed
    # workload in this org uses `/search` (here) + `/match` (on the
    # ExternalSecret) instead; see gitops/base/agent-runtime/external-secret.yaml
    # and onepassword-external-secret.yaml.
    reloader.stakater.com/search: "true"
spec:
  replicas: 1
  # Default (600s) is shorter than preflight can legitimately take (~20 min) —
  # without this, a normal slow start reports as a stalled/degraded rollout
  # (ArgoCD, kubectl rollout status) even though the pod is fine.
  progressDeadlineSeconds: 1800
  selector:
    matchLabels:
      app.kubernetes.io/name: agentrunner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentrunner
      annotations:
        # An interrupted session resumes from the last provider turn boundary,
        # not from wherever it was mid-turn, so an eviction still costs real
        # work. cluster-autoscaler consolidation looks only at requested
        # cpu/memory (never live usage), so a node hosting an actively-spiking
        # session can still be picked as underutilized and drained. This stops
        # that: never a scale-down eviction target. Paired with the PDB in
        # pdb.yaml (belt-and-suspenders — see AIPLAT-153).
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      # Budget for entrypoint.sh's shutdown sequence: DRAIN_MAX_SECONDS waiting
      # for in-flight tasks to finish, then DAEMON_STOP_WAIT_SECONDS for the
      # daemon to exit, plus margin for the status polls themselves. Must exceed
      # their sum or kubelet SIGKILLs the pod mid-sequence.
      #
      # Deliberately not sized to outlast a long agent session: sessions run for
      # hours, so waiting one out is not achievable at any grace period. The
      # drain only catches tasks genuinely seconds from done; anything still
      # running is stopped recoverably instead (see entrypoint.sh for why that
      # means SIGKILL), so a short window is preferable to a long one that
      # stalls every deploy without saving the session.
      terminationGracePeriodSeconds: 180
      serviceAccountName: agentrunner
      imagePullSecrets:
        - name: regcred
      # fsGroup so the tmpfs-backed secrets volume below is group-writable by
      # the non-root `agent` user (uid/gid 1000 in agent-runtime-base/Dockerfile) —
      # emptyDir volumes are otherwise created root-owned and entrypoint.sh's
      # `chmod 700 "${SECRETS_DIR}"` would fail with EPERM.
      securityContext:
        fsGroup: 1000
      # AIPLAT-165: EFS access points come back owned by root, and `install -d
      # -o agent -g agent` in the Dockerfile only ever chowned the image's
      # ephemeral layer — the PVC needs the same fix applied at pod start.
      # Mirrors devenv's fix-efs-permissions init container (configuration
      # repo). `multica_workspaces` holds real git checkouts (like devenv's
      # own `workspaces` dir), so it only ever gets a top-level chown — a
      # recursive one would scale with repo size and meaningfully slow every
      # pod start. The rest are tool caches/config that nest arbitrarily deep
      # on their own (bazel under .cache, npm under .npm-global, etc.) but
      # stay small, so they're chowned recursively: a top-level-only fix
      # would leave any subtree a tool once created while running as root
      # permanently stuck root-owned, since the PVC persists across restarts.
      initContainers:
        - name: fix-efs-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Fixing volume permissions for uid 1000..."
              chown 1000:1000 /home-efs 2>/dev/null || true
              for d in .npm-global .local .cache .hermes .git-ai .multica .agents; do
                [ -e "/home-efs/$d" ] && chown -R 1000:1000 "/home-efs/$d" 2>/dev/null || true
              done
              [ -e "/home-efs/multica_workspaces" ] && chown 1000:1000 "/home-efs/multica_workspaces" 2>/dev/null || true
              echo "Permissions fixed."
          volumeMounts:
            - name: home
              mountPath: /home-efs
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
      containers:
        - name: main
          image: ghcr.io/g2crowd/agentrunner-runtime-prod
          imagePullPolicy: Always
          env:
            - name: ATLASSIAN_SITE
              value: https://g2crowd.atlassian.net
            # The IRSA webhook injects AWS_ROLE_ARN and
            # AWS_WEB_IDENTITY_TOKEN_FILE but never a region, and neither the
            # AWS CLI nor boto3 has a default one — without this every call
            # fails with "You must specify a region" (AIPLAT-169).
            - name: AWS_REGION
              value: us-east-1
            # Shutdown timings for entrypoint.sh, surfaced here so they can be
            # tuned per environment without an image rebuild. Their sum must stay
            # under terminationGracePeriodSeconds above.
            - name: DRAIN_MAX_SECONDS
              value: "120"
            - name: DAEMON_STOP_WAIT_SECONDS
              value: "30"
            - name: DEFAULT_GIT_REPO
              value: "https://github.com/g2crowd/ai-enhancement-hub,https://github.com/g2crowd/ue,https://github.com/g2crowd/companies_service"
            # Enterprise Platform Bot GitHub App — installed in both g2crowd and
            # gartner-digital-markets, enabling cross-org repo access.
            # The credential helper resolves the correct installation ID
            # dynamically at mint time, so no per-org installation ID is needed.
            # The private key (GITHUB_APP_PRIVATE_KEY) arrives via the
            # agentrunner-secrets envFrom below.
            # TODO: replace with G2 Enterprise Platform Bot app ID once confirmed.
            - name: GITHUB_APP_ID
              value: "4153447"
            # Fallback org for gh CLI invocations that run outside a git checkout.
            # Dynamic installation discovery covers the git credential path without
            # this; it is only needed when the gh wrapper cannot detect a remote.
            - name: GITHUB_DEFAULT_ORG
              value: "g2crowd"
            # Bot git identity. Declared here (not via the secret) so it takes
            # precedence over any GIT_USER_* swept in through envFrom — commits
            # from runner agents are attributed to the bot, not the requester.
            # TODO: update to Enterprise Bot identity once confirmed.
            - name: GIT_USER_NAME
              value: "g2-enterprise-platform-bot[bot]"
            - name: GIT_USER_EMAIL
              value: "g2-enterprise-platform-bot[bot]@users.noreply.github.com"
          envFrom:
            - secretRef:
                name: agentrunner-secrets
            # 1Password per-workspace secrets (onepassword-external-secret.yaml,
            # AIPLAT-161). optional: true because the target Secret doesn't exist
            # at all when the workspace has no onepassword_vault configured, and
            # is deleted (deletionPolicy: Delete) on a zero-tag-match sweep — both
            # cases must not block pod startup.
            - secretRef:
                name: agentrunner-1password-secrets
                optional: true
          volumeMounts:
            # AIPLAT-165: EFS-backed $HOME so npm/uv installs, git-ai config,
            # and hermes's cache persist across restarts. Mounted at the
            # whole-$HOME level (not per-subdir subPaths like devenv) so
            # entrypoint.sh needs zero awareness of what's persisted — see
            # storage.yaml for the full rationale and known tradeoffs. Listed
            # before the secrets mount below so that tmpfs mount still wins
            # at /home/agent/.secrets.
            - name: home
              mountPath: /home/agent
            # tmpfs-backed so PEM secrets entrypoint.sh materializes under
            # ~/.secrets (ROIPPC-2) live in RAM only, never the node's disk.
            - name: secrets
              mountPath: /home/agent/.secrets
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            # The daemon's health port is loopback-only (it also carries
            # unauthenticated /shutdown and /repo/checkout — see
            # server/internal/daemon/health.go), so the kubelet's httpGet can't
            # reach it from the pod IP. Uses the daemon's own CLI instead of
            # hand-rolled curl, so it stays correct if the health port or
            # response shape ever changes. "starting" (PAT renew + workspace
            # sync + runtime registration) can take 10-20 min; no livenessProbe,
            # since that window would otherwise crash-loop the pod.
            exec:
              command:
                - sh
                - -c
                - '[ "$(multica daemon status --output json | jq -r .status)" = "running" ]'
            initialDelaySeconds: 15
            periodSeconds: 15
            # This is an exec probe: forking sh, multica, and jq costs real
            # CPU-scheduling time on top of the check logic itself. Under the
            # node-CPU contention this pod template's topologySpreadConstraint
            # (above) targets, that fork/exec chain alone can burn several
            # seconds before the daemon's own status logic ever runs — a
            # too-tight timeout fails the probe on scheduling latency, not on
            # the daemon actually being unready (AIPLAT-162). Kept comfortably
            # under periodSeconds so a slow attempt can't overlap the next tick.
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: agentrunner-home
        - name: secrets
          emptyDir:
            medium: Memory
            # Generous headroom over the handful of PEM keys this ever holds;
            # small enough to be a non-issue against the 2Gi pod memory limit.
            sizeLimit: 16Mi
      # Every workspace is a separate Deployment (replicas: 1) sharing this same
      # pod template, so the scheduler's request-based bin-packing (500m request
      # vs 2 CPU limit — a 4x burst allowance) can and does stack several
      # concurrently-booting pods from different workspaces onto the same node
      # during a fleet-wide rollout, saturating its CPU and blowing every
      # provider's version-detection timeout (AIPLAT-162). DoNotSchedule (not
      # ScheduleAnyway) so this is an enforced spread, not just a preference —
      # the cluster-autoscaler already has headroom to max_size=12 nodes and
      # will scale up to satisfy it rather than stack pods.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: agentrunner
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: eks.amazonaws.com/compute-type
                    operator: NotIn
                    values:
                      - auto
                      - fargate
                  # AIPLAT-153: agentrunner-runtime is a multi-arch image; require
                  # Graviton now that the arm64 agentrunner-graviton node group
                  # exists alongside the x86 one. This is the cutover trigger —
                  # every existing singleton Deployment gets a new pod template
                  # hash on merge/sync and rolls onto arm64 capacity.
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - arm64
      tolerations:
        - key: CostCenter
          operator: Equal
          value: agentrunner
          effect: NoSchedule
