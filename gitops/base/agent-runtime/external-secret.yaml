---
# Per-workspace + shared secrets fused into a single ESO.
# The PLACEHOLDER path segment is patched per-Application by the ApplicationSet's
# kustomize.patches, resolving to the actual workspace slug.
# Shared keys (/agentfarm/development/agentrunner/shared/*) are swept in by the
# second dataFrom.find entry so all env vars arrive via a single envFrom secretRef.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentrunner-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: secretstore-aws-ssm
    kind: ClusterSecretStore
  target:
    name: agentrunner-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    # Enterprise Platform Bot GitHub App private key (PEM). Not per-workspace and
    # not touched by the ApplicationSet per-slug patch, so it stays constant across
    # all runners. The runner mints short-lived installation tokens from it via
    # git-credential-platform-bot; installation IDs are resolved dynamically.
    # App ID is non-secret and supplied as plain env in deployment.yaml.
    # TODO: confirm SSM path for G2 Enterprise Platform Bot private key.
    - secretKey: GITHUB_APP_PRIVATE_KEY
      remoteRef:
        key: /infra/g2-enterprise-platform-bot
  dataFrom:
    - find:
        path: /agentfarm/development/agentrunner/PLACEHOLDER
        name:
          regexp: "^/agentfarm/development/agentrunner/PLACEHOLDER/[^/]+$"
      rewrite:
        - regexp:
            source: "/agentfarm/development/agentrunner/PLACEHOLDER/(.*)"
            target: "$1"
    - find:
        path: /agentfarm/development/agentrunner/shared
        name:
          regexp: "^/agentfarm/development/agentrunner/shared/[^/]+$"
      rewrite:
        - regexp:
            source: "/agentfarm/development/agentrunner/shared/(.*)"
            target: "$1"
