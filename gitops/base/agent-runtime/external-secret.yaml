---
# Per-workspace + shared secrets fused into a single ESO.
# The PLACEHOLDER path segment is patched per-Application by the ApplicationSet's
# kustomize.patches, resolving to the actual workspace slug.
# Shared keys (/agentfarm/development/agentrunner/shared/*) are swept in by the
# second dataFrom.find entry so all env vars arrive via a single envFrom secretRef.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentrunner-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: secretstore-aws-ssm
    kind: ClusterSecretStore
  target:
    name: agentrunner-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
  dataFrom:
    - find:
        path: /agentfarm/development/agentrunner/PLACEHOLDER
        name:
          regexp: "^/agentfarm/development/agentrunner/PLACEHOLDER/[^/]+$"
      rewrite:
        - regexp:
            source: "/agentfarm/development/agentrunner/PLACEHOLDER/(.*)"
            target: "$1"
    - find:
        path: /agentfarm/development/agentrunner/shared
        name:
          regexp: "^/agentfarm/development/agentrunner/shared/[^/]+$"
      rewrite:
        - regexp:
            source: "/agentfarm/development/agentrunner/shared/(.*)"
            target: "$1"
