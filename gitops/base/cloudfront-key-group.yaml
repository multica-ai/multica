---
# CloudFront signing key pair for authenticated download URLs / signed cookies.
#
# Setup (one-time manual step before applying):
#   1. Generate an RSA 2048-bit key pair:
#        openssl genrsa -out cf-private.pem 2048
#        openssl rsa -pubout -in cf-private.pem -out cf-public.pem
#   2. Store the private key in AWS Secrets Manager as raw PEM. The backend
#      (server/internal/auth/cloudfront.go) reads SecretString and feeds it
#      straight to pem.Decode — no base64 layer, or the decode will fail:
#        aws secretsmanager create-secret \
#          --name multica/cloudfront-signing-key \
#          --secret-string file://cf-private.pem
#   3. Store the PUBLIC key PEM in SSM (not sensitive, but kept consistent with
#      the ExternalSecret pattern so Crossplane can read it from the cluster Secret):
#        aws ssm put-parameter \
#          --name /agentfarm/tools/CLOUDFRONT_PUBLIC_KEY \
#          --type SecureString \
#          --value "$(cat cf-public.pem)"
#      The ExternalSecret in secret-store.yaml will sync it into the
#      agentfarm-secret-store Secret under key CLOUDFRONT_PUBLIC_KEY.
#   4. Apply this manifest. Crossplane will create the PublicKey in CloudFront,
#      then resolve the KeyGroup's itemRefs to obtain the PublicKey ID automatically.
#      No manual ID lookup or placeholder replacement needed.
---
apiVersion: cloudfront.aws.upbound.io/v1beta1
kind: PublicKey
metadata:
  name: agentfarm-cloudfront-signing-key
spec:
  # encodedKey is immutable in CloudFront — Crossplane must not attempt updates.
  # Observe+Create+Delete allows adoption of existing keys and creation of new ones
  # but never calls UpdatePublicKey (which CloudFront rejects for the key body).
  managementPolicies: ["Observe", "Create", "Delete"]
  forProvider:
    name: agentfarm-cloudfront-signing-key
    comment: "RSA signing key for agentfarm CloudFront signed cookies"
    # Required by schema. Used on creation only (managementPolicies excludes Update).
    encodedKeySecretRef:
      name: agentfarm-secret-store
      namespace: agentfarm
      key: CLOUDFRONT_PUBLIC_KEY
  providerConfigRef:
    name: agentfarm-provider-aws-upbound-config
---
apiVersion: cloudfront.aws.upbound.io/v1beta1
kind: KeyGroup
metadata:
  name: agentfarm-cloudfront-key-group
spec:
  forProvider:
    name: agentfarm-cloudfront-key-group
    comment: "Signing key group for agentfarm signed-cookie authentication"
    # Cross-resource ref: Crossplane resolves the PublicKey ID automatically.
    itemRefs:
      - name: agentfarm-cloudfront-signing-key
  providerConfigRef:
    name: agentfarm-provider-aws-upbound-config
