# Per-workspace 1Password SecretStore. The vault name is a placeholder that
# the agentrunner-dev-appset replaces per Application from the workspace's
# registry entry (SSM key /agentfarm/tools/agentrunner-dev/<slug>, JSON value
# {"onepassword_vault": "vault-name"}). Defaults to "AI Platform Engineering"
# when the registry entry carries no vault (AIPLAT-161).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: onepassword-squad-vault
spec:
  provider:
    onepasswordSDK:
      vault: PLACEHOLDER_VAULT
      auth:
        serviceAccountSecretRef:
          name: agentrunner-secrets
          key: ONEPASSWORD_SA_TOKEN
