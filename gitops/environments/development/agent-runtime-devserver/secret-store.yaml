# Phase-1 test (AIPLAT-106): every dev-server runner gets the same fixed
# squad vault attached. Per-squad routing is deferred to a later phase — the
# vault name is hardcoded here rather than derived per-workspace.
#
# Auth token: rather than a dedicated bootstrap ExternalSecret, this points at
# the ONEPASSWORD_SA_TOKEN key already present in the existing agentrunner-secrets
# Secret (swept in from the shared SSM bucket by agent-runtime/external-secret.yaml
# dataFrom[1]). Trade-off accepted: the token is therefore also exposed as a
# plain env var inside the runner container's own process env via envFrom.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: onepassword-squad-vault
spec:
  provider:
    onepasswordSDK:
      vault: AI Platform Engineering
      auth:
        serviceAccountSecretRef:
          name: agentrunner-secrets
          key: ONEPASSWORD_SA_TOKEN
