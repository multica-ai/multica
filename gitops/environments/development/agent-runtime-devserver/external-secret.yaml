# Extracts all fields from the "Agentfarm Bot" item in the AI Platform Engineering
# vault into a dedicated Secret, kept separate from agentrunner-secrets (SSM-backed)
# so a 2nd envFrom can be added without touching the existing ESO (AIPLAT-106).
#
# Uses dataFrom.extract (GetSecretMap) rather than dataFrom.find.tags (GetAllSecrets)
# because ESO 0.18.2 — the version deployed in the development cluster — has
# GetAllSecrets as an unimplemented stub in the onepasswordsdk provider.
# GetSecretMap is fully implemented in 0.18.2 and maps each 1Password field title
# to a k8s Secret key verbatim (no transforms). Field titles must therefore match
# the desired env var names exactly (e.g. DATABASE_URL, not "database url").
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentrunner-1password-secrets
  annotations:
    reloader.stakater.com/match: "true"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: onepassword-squad-vault
    kind: SecretStore
  target:
    name: agentrunner-1password-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
  dataFrom:
    - extract:
        key: "Agentfarm Bot"
