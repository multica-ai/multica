# Pulls every `agentfarm`-tagged item from the AI Platform Engineering vault
# into a dedicated Secret, kept separate from agentrunner-secrets (SSM-backed)
# so a 2nd envFrom can be added without touching the existing ESO (AIPLAT-106).
#
# Uses dataFrom.find.tags (GetAllSecrets) — available since ESO v2.7.0, which
# is deployed in this cluster. This is preferred over dataFrom.extract because
# it discovers secrets dynamically by tag rather than hardcoding an item name.
#
# Field-key mapping: the k8s Secret key is the 1Password item FIELD TITLE
# verbatim — no item-name prefix, no case transform, no rewrite applied by
# the provider. Two tagged items sharing a field title is a hard ESO error
# ("found multiple labels with the same key"). Consequently: whoever authors
# `agentfarm`-tagged items in this vault MUST (a) name each field exactly as
# the desired env var (e.g. DATABASE_URL, not "database url") and (b) keep
# field titles unique across every `agentfarm`-tagged item in the vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentrunner-1password-secrets
  annotations:
    reloader.stakater.com/match: "true"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: onepassword-squad-vault
    kind: SecretStore
  target:
    name: agentrunner-1password-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
  dataFrom:
    - find:
        tags:
          agentfarm: "" # value unused; presence = match
