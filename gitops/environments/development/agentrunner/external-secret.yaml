# Pulls the daemon's connection credentials from AWS SSM Parameter Store.
# Lives in the development overlay because the agentrunner is currently a
# dev-cluster-only workload (see PR feedback on TCA-12 — "Is this needed?"
# on the tools env). When we promote this to tools we'll move the manifests
# back to base/ and split the SSM keys across env-scoped paths.
#
# Required SSM parameters (provision out of band):
#   /agentfarm/development/AGENTRUNNER_MULTICA_SERVER_URL
#   /agentfarm/development/AGENTRUNNER_MULTICA_APP_URL
#   /agentfarm/development/AGENTRUNNER_MULTICA_TOKEN              (SecureString — mul_... PAT)
#   /agentfarm/development/AGENTRUNNER_ANTHROPIC_API_KEY          (SecureString — sk-ant-...)
#   /agentfarm/development/AGENTRUNNER_MULTICA_AGENT_RUNTIME_NAME
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentfarm-agentrunner
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    reloader.stakater.com/match: "true"
  labels:
    app: agentfarm
    component: agentrunner
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: secretstore-aws-ssm
    kind: ClusterSecretStore
  target:
    name: agentfarm-agentrunner
    creationPolicy: Owner
  data:
    - secretKey: MULTICA_SERVER_URL
      remoteRef:
        key: /agentfarm/development/AGENTRUNNER_MULTICA_SERVER_URL
    - secretKey: MULTICA_APP_URL
      remoteRef:
        key: /agentfarm/development/AGENTRUNNER_MULTICA_APP_URL
    - secretKey: MULTICA_TOKEN
      remoteRef:
        key: /agentfarm/development/AGENTRUNNER_MULTICA_TOKEN
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: /agentfarm/development/AGENTRUNNER_ANTHROPIC_API_KEY
    # Runtime label shown in the Multica UI for runtimes registered by this
    # daemon. Sourced from SSM (Jack's PR feedback) so additional agentrunner
    # deployments can identify themselves without a manifest change.
    - secretKey: MULTICA_AGENT_RUNTIME_NAME
      remoteRef:
        key: /agentfarm/development/AGENTRUNNER_MULTICA_AGENT_RUNTIME_NAME
