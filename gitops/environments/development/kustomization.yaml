# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agentfarm
labels:
  - pairs:
      app: agentfarm-development
    includeSelectors: true
    includeTemplates: true
resources:
  - ../../base/
  - infra/s3-uploads-bucket.yaml
  # Dev-only workloads (not in base/). The agentrunner pod hosts the
  # multica daemon + Claude Code and is currently scoped to the dev cluster
  # while we test it (see PR review on TCA-12).
  - agentrunner/
patchesStrategicMerge:
  # Infra patches — override env-specific values from base (VPC, subnets, OIDC, tags)
  - infra/iam-resources.yaml
  - infra/iam-backend.yaml
  - infra/rds-security-group.yaml
  - infra/rds-subnet-group.yaml
  - infra/rds-cluster.yaml
  - infra/rds-instance.yaml
  - infra/elasticache-security-group.yaml
  - infra/elasticache-subnet-group.yaml
  - infra/elasticache-replication-group.yaml
  # App patches — env-specific service accounts, secrets, ingress, deployments
  - patches/service-account.yaml
  - patches/service-account-backend.yaml
  - patches/secret-store.yaml
  - patches/deployment-backend.yaml
  - patches/ingress.yaml
  # Delete patches — remove resources not needed in dev
  - patches/delete-hpa-pdb.yaml
  - patches/delete-cloudfront.yaml
images:
  - name: ghcr.io/g2crowd/agentfarm-backend-prod
    newTag: "4ab9f3c0"
  - name: ghcr.io/g2crowd/agentfarm-web-prod
    newTag: "5dd72cd8"
  - name: ghcr.io/g2crowd/agentfarm-agentrunner-prod
    # Same SHA the tools env runs (PR #96, the agent-runtime-base refactor).
    # The agentrunner image is currently sourced from -prod alongside backend
    # and web; a follow-up PR will switch all three to the new
    # agentfarm-{backend,web,agentrunner}-dev repos once one dev-labeled PR
    # has run dev.yml and populated those repos with at least one build.
    # Image Updater on the agentfarm-development Application (in
    # g2crowd/configuration) will then take over keeping these SHAs current.
    newTag: "bc90fc3e"
