# Low-provisioned dev profile: fixed-capacity cluster (no serverless v2 scaling).
# $patch: replace on spec.forProvider removes serverlessv2ScalingConfiguration
# that the tools base cluster uses, keeping all other cluster settings.
apiVersion: rds.aws.upbound.io/v1beta2
kind: Cluster
metadata:
  name: agentfarm-postgres-cluster
spec:
  forProvider:
    $patch: replace
    region: us-east-1
    engine: aurora-postgresql
    # 16.8 matches every other working aurora-postgresql cluster on the dev
    # EKS cluster (unsurvey, ai-playbooks, agent-eval-tool, etc.). 16.4 hit
    # a Upbound RDS provider drift loop on enable_*_write_forwarding that
    # prevented status.atProvider from being written back, which in turn
    # held ArgoCD's health gate on the Cluster CR and blocked the entire
    # wave-2/3 chain (Redis SubnetGroup, SecurityGroup, ReplicationGroup).
    # 16.4 -> 16.8 is a valid in-place minor upgrade (no replacement).
    engineVersion: "16.8"
    allowMajorVersionUpgrade: true
    applyImmediately: false
    databaseName: agentfarm
    masterUsername: agentfarmadmin
    masterPasswordSecretRef:
      key: POSTGRES_MASTER_PASSWORD
      name: agentfarm-secret-store
      namespace: agentfarm
    dbSubnetGroupNameRef:
      name: agentfarm-db-subnet-group
    vpcSecurityGroupIdRefs:
      - name: agentfarm-postgresql-sg
    backupRetentionPeriod: 7
    preferredBackupWindow: "03:00-04:00"
    preferredMaintenanceWindow: "sun:04:00-sun:05:00"
    storageEncrypted: true
    skipFinalSnapshot: false
    finalSnapshotIdentifier: agentfarm-postgres-dev-final-snapshot
    enabledCloudwatchLogsExports:
      - postgresql
    tags:
      Owner: DevOps
      Production: "false"
      Name: agentfarm-postgres-cluster
      Environment: development
      Application: agentfarm
      # AWS tag values restrict charset to letters/digits/whitespace + _ . : / = + - @
      # Parens () are NOT in the allowed set — using "- dev" suffix instead.
      Purpose: "agentfarm application database - dev"
