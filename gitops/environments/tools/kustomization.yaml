# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agentfarm
labels:
  - pairs:
      app: agentfarm-tools
    includeSelectors: true
    includeTemplates: true
resources:
  - ../../base/
patches:
  - path: patches/service-account.yaml
    target:
      group: ""
      version: v1
      kind: ServiceAccount
      name: agentfarm
  - path: patches/service-account-backend.yaml
    target:
      group: ""
      version: v1
      kind: ServiceAccount
      name: agentfarm-backend
images:
  - name: ghcr.io/g2crowd/agentfarm-backend-prod
    newTag: "b4dc7ebc"
  - name: ghcr.io/g2crowd/agentfarm-web-prod
    newTag: "b4dc7ebc"

# The daemon image is intentionally NOT a kustomize images: entry —
# no GitOps-managed resource references it (per-workspace daemon
# Deployments are created by the controller at runtime, not by ArgoCD).
# Instead, the publish workflow's commit-to-gitops-daemon job patches
# the controller's DAEMON_IMAGE_TAG env directly via yq. See
# .github/workflows/publish.yml.
