<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Multica">
  <!--
    Full-bleed source for the generated home-screen icons (apple-touch-icon.png,
    icon-maskable-512.png). Full-bleed because both surfaces mask the artwork
    themselves: iOS rounds the corners, Android crops to the launcher shape. The
    m is cropped inside a thin edge in the tile colour (2.6% of the side), the
    same way the brand's app icon and avatar crop it.
  -->
  <defs><clipPath id="c"><rect x="2.6" y="2.6" width="94.8" height="94.8" rx="19.9"/></clipPath></defs>
  <rect width="100" height="100" fill="#0b0b0c"/>
  <g clip-path="url(#c)"><path transform="translate(-4.72 22) scale(0.96)" d="M0 85.25V34A34 34 0 0 1 68 34V85.25H46V34A12 12 0 0 0 22 34V85.25ZM46 85.25V34A34 34 0 0 1 114 34V85.25H92V34A12 12 0 0 0 68 34V85.25Z" fill="#fff"/></g>
</svg>
