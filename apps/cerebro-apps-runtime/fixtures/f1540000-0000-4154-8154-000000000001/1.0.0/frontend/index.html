<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Allergen Formatter</title>
<style>body{font:15px system-ui;margin:0;padding:clamp(16px,4vw,32px);color:#18181b}main{max-width:720px;margin:auto}textarea{box-sizing:border-box;width:100%;min-height:180px;padding:12px;border:1px solid #d4d4d8;border-radius:10px}button{margin-top:12px;padding:11px 16px;border:0;border-radius:8px;background:#18181b;color:white;font-weight:650}pre{white-space:pre-wrap;background:#f4f4f5;padding:12px;border-radius:10px}</style></head>
<body><main><h1>Allergen Formatter</h1><p>Paste ingredients to uppercase regulated allergens and return a separate allergen column.</p><form><label for="ingredients">Ingredients</label><textarea id="ingredients" required></textarea><button>Format ingredients</button></form><pre id="result" hidden></pre></main>
<script>document.querySelector('form').addEventListener('submit',async(e)=>{e.preventDefault();const out=document.querySelector('#result');out.hidden=false;out.textContent='Formatting…';const response=await fetch('/workers/f1540000-0000-4154-8154-000000000001/1.0.0/invoke',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ingredients:document.querySelector('#ingredients').value})});out.textContent=JSON.stringify(await response.json(),null,2)});</script></body></html>
