services:
  cerebro-app-worker:
    image: multica/cerebro-app-worker:latest
    build:
      context: ../..
      dockerfile: apps/cerebro-apps-runtime/Dockerfile.worker
    profiles: ["worker-image"]

  cerebro-apps-runtime:
    build:
      context: ../..
      dockerfile: apps/cerebro-apps-runtime/Dockerfile
    ports:
      - "4310:4310"
    environment:
      MULTICA_FRAME_ANCESTORS: http://localhost:3000
      CEREBRO_APPS_RUNTIME_PROVIDER: sliplane
      CEREBRO_APPS_BACKEND_URL: ${CEREBRO_APPS_BACKEND_URL:-http://host.docker.internal:8080}
      CEREBRO_APPS_RUNTIME_SERVICE_KEY: ${CEREBRO_APPS_RUNTIME_SERVICE_KEY:-local-runtime-key}
      CEREBRO_APPS_SLIPLANE_PROJECT_ID: ${CEREBRO_APPS_SLIPLANE_PROJECT_ID:-local-project}
      CEREBRO_APPS_SLIPLANE_SERVER_ID: ${CEREBRO_APPS_SLIPLANE_SERVER_ID:-local-server}
      SLIPLANE_KEY: ${SLIPLANE_KEY:-local-sliplane-key}
    mem_limit: 256m
    cpus: 1.0
    read_only: true
    tmpfs:
      - /tmp:size=32m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4310/healthz"]
      interval: 10s
      timeout: 2s
      retries: 3
